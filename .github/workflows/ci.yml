name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run that's still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux on Node 24 and 26. The desktop app ships the engine to Windows and Mac too, so the public
      # repository also tests there, where GitHub's runners are free. The private copy of this repository
      # pays for every minute past a small monthly credit (a Mac minute costs about ten Linux ones), so it
      # tests on Linux and leaves Windows and Mac to the release in the public repository.
      matrix: ${{ fromJSON(github.repository == 'Zibhelina/etude' && '{"os":["ubuntu-latest"],"node":[24,26],"include":[{"os":"windows-latest","node":24},{"os":"macos-latest","node":24}]}' || '{"os":["ubuntu-latest"],"node":[24,26]}') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Desktop app types
        if: matrix.os == 'ubuntu-latest'
        run: npm --prefix desktop ci && npm --prefix desktop run typecheck
      - run: npm run build
