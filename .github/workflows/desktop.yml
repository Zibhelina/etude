name: Desktop app

# Builds the desktop installers on Mac, Windows and Linux and tests each packaged app from a folder
# outside the repo (desktop/smoke.ts). On a pull request the installers are kept as artifacts to try.
# On a version tag they go into a draft release, published by hand after trying it (see the release
# routine in the plan); only then do downloads and the apps' updaters see it.

on:
  pull_request:
    paths: ["desktop/**", "src/**", "web/**", "bin/**", "runtime/**", "types/**", "schedulers/**", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: rpmbuild, for the .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix desktop ci
      - name: Installers
        run: node desktop/build.ts
        env:
          # Only the Mac build gets the Apple secrets, and never a pull request's. Without them (or with
          # only the certificate) the build still works: signed ad hoc, or signed but not notarized.
          # docs/signing.md lists what each secret holds. The repository variable MAC_SIGNING=off builds the Mac
          # apps unsigned (ad hoc) even with the secrets set, while Apple's first notarization for the team is held.
          CSC_LINK: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.APPLE_API_ISSUER || '' }}
      - name: The Mac apps' signatures hold
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.MAC_CERTIFICATE != '' }}
          NOTARIZED: ${{ github.event_name != 'pull_request' && vars.MAC_SIGNING != 'off' && secrets.MAC_CERTIFICATE != '' && secrets.APPLE_API_KEY != '' }}
        run: |
          set -e
          for app in desktop/dist/out/mac-arm64/Etude.app desktop/dist/out/mac/Etude.app; do
            if [ "$SIGNED" != true ]; then
              # No signing secrets (pull requests): electron-builder leaves only the linker's ad hoc
              # signature on the binaries, which --strict rejects. Seal the bundle ad hoc so the check
              # still catches a broken bundle; the Developer ID checks below run on main and tags.
              codesign --force --deep --sign - "$app"
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "$SIGNED" = true ]; then
              info=$(codesign -dvv "$app" 2>&1)
              echo "$info" | grep -E "^(Authority|TeamIdentifier)="
              echo "$info" | grep -q "^Authority=Developer ID Application"
              echo "$info" | grep -q "flags=.*runtime"
            fi
            if [ "$NOTARIZED" = true ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=4 "$app"
            fi
          done
          if [ "$NOTARIZED" = true ]; then
            for dmg in desktop/dist/out/Etude-mac-*.dmg; do
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            done
          fi
      - name: The packaged app runs from outside the repo
        run: node desktop/smoke.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: etude-${{ runner.os }}
          path: |
            desktop/dist/out/Etude-*
            desktop/dist/out/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: files
          merge-multiple: true
      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a dash (v2.5.0-beta.1) is a pre-release: normal users and the updaters skip it.
          pre=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $pre --title "Etude ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
