name: iOS app to TestFlight

# Builds the iPhone and iPad app on a Mac runner, signs it with the team's App Store Connect API key
# (Xcode's automatic, cloud-managed signing: no certificate or profile is kept in the repository or in
# a secret) and uploads it to App Store Connect, where the internal TestFlight group gets every build.
# Runs on every push to main and by hand; never on a pull request, which gets no secrets.
# store/ios/README.md says what the secrets hold and what the key needs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time, and never cancel one halfway: a newer push waits for the running build.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  APPLE_TEAM_ID: HHSH3L6Z42
  ASC_APP_ID: "6830453552"

jobs:
  testflight:
    if: github.repository == 'Zibhelina/etude'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version and build number
        id: version
        # The marketing version comes from package.json (scripts/native-version.mjs keeps the Xcode project
        # in step). The build number is that version's own number (3.0.3 → 30003) followed by this run, so
        # each upload is new to App Store Connect and sorts after the hand-made ones (30003, 30003.1, …).
        run: |
          set -euo pipefail
          node scripts/native-version.mjs --check
          version=$(node -p 'require("./package.json").version')
          base=$(node -p 'const [a, b, c] = require("./package.json").version.split(".").map(Number); a * 10000 + b * 100 + c')
          build="$base.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Etude $version, build $build"
      - name: Web app into the iOS project
        run: |
          npm run build:browser
          npx cap sync ios
      - name: App Store Connect key
        env:
          # APPLE_API_KEY holds the .p8 file's text, as for the desktop workflow (docs/signing.md); its base64 works too.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER must all be set (store/ios/README.md)"
            exit 1
          fi
          dir="$RUNNER_TEMP/asc"
          mkdir -m 700 -p "$dir"
          key="$dir/AuthKey_$APPLE_API_KEY_ID.p8"
          if printf '%s' "$APPLE_API_KEY" | grep -q "PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY" > "$key"
          else
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          grep -q "PRIVATE KEY" "$key" || { echo "::error::APPLE_API_KEY is neither the .p8 text nor its base64"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive (unsigned)
        # Unsigned on purpose: signing the archive made Xcode create a development certificate every
        # run, and Apple e-mails the account holder each time one is created or revoked. The export
        # below signs with the Apple-managed distribution certificate instead.
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild archive -quiet \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Etude.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: The archive is the intended app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Etude.xcarchive/Products/Applications/App.app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          echo "$(plist CFBundleIdentifier) $(plist CFBundleShortVersionString) ($(plist CFBundleVersion))"
          [ "$(plist CFBundleIdentifier)" = study.etude.app ]
          [ "$(plist CFBundleShortVersionString)" = "$VERSION" ]
          [ "$(plist CFBundleVersion)" = "$BUILD" ]
          test -f "$app/public/index.html"
      - name: Sign for the App Store and upload
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Etude.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Apple processes the build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          node scripts/ios-ci.mjs wait-build "$VERSION" "$BUILD"
          echo "Etude $VERSION ($BUILD) is in App Store Connect; the internal TestFlight group gets it once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
