apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

import groovy.json.JsonSlurper

// Version from the repo's package.json plus an optional Android-only build number, ETUDE_ANDROID_BUILD (default 0),
// for a store upload that doesn't bump package.json:
//   versionCode = major*1000000 + minor*10000 + patch*100 + build
//   versionName = the package.json version, then ".<build>" when build > 0
// 3.1.1 → "3.1.1" / 3010100; 3.1.1 with ETUDE_ANDROID_BUILD=1 → "3.1.1.1" / 3010101; 3.1.2 → "3.1.2" / 3010200.
// Every code is above the old scheme's (major*10000 + minor*100 + patch, last used for 3.1.1 = 30101).
def etudeVersion = new JsonSlurper().parse(file('../../package.json')).version
def (vMajor, vMinor, vPatch) = etudeVersion.tokenize('.-')[0..2].collect { it as int }
def buildEnv = System.getenv('ETUDE_ANDROID_BUILD')?.trim()
if (buildEnv && !(buildEnv ==~ /\d+/)) throw new GradleException("ETUDE_ANDROID_BUILD must be a whole number, got '${buildEnv}'")
def etudeAndroidBuild = buildEnv ? (buildEnv as int) : 0
if (vMinor > 99 || vPatch > 99 || etudeAndroidBuild > 99) {
    throw new GradleException("minor, patch and ETUDE_ANDROID_BUILD must be below 100 for the versionCode scheme (${etudeVersion}, build ${etudeAndroidBuild})")
}
def etudeVersionCode = vMajor * 1000000 + vMinor * 10000 + vPatch * 100 + etudeAndroidBuild
def etudeVersionName = etudeAndroidBuild > 0 ? "${etudeVersion}.${etudeAndroidBuild}" : etudeVersion

// Release signing reads the upload keystore from the environment, so no key is ever committed.
// See store/android/README.md for the keytool command.
def keystorePath = System.getenv('ETUDE_KEYSTORE')

android {
    namespace = "study.etude.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "study.etude.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode etudeVersionCode
        versionName etudeVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ETUDE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ETUDE_KEY_ALIAS') ?: 'etude-upload'
                keyPassword System.getenv('ETUDE_KEY_PASSWORD') ?: System.getenv('ETUDE_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Unsigned when ETUDE_KEYSTORE isn't set (the bundle can still be built and inspected).
            if (keystorePath) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Etude Sync through Google Play Billing (EtudeStorePlugin.kt).
    implementation "com.android.billingclient:billing:$playBillingVersion"
    // Custom Tabs for the ChatGPT sign-in page (EtudeAuthPlugin.kt).
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
