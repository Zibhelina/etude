<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etude · Atom</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
.card { min-height: 100%; }
.header, .content, .history { padding: 20px 26px; }
.header, .content { border-bottom: 1px solid var(--border); }
.identity { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 12px; }
.atom-id { color: var(--accent); font: 600 12px/1.4 var(--mono); }
h1 { margin: 0; font-size: 18px; line-height: 1.35; letter-spacing: -.01em; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 14px; }
.tag, .pill { padding: 3px 8px; background: var(--panel2); border-radius: 999px; color: var(--dim); font-size: 11.5px; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 0; margin-top: 16px; color: var(--dim); font-size: 12.5px; }
.stat { padding: 0 12px; border-left: 1px solid var(--border); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat strong { color: var(--text); font-weight: 600; }
.label { color: var(--faint); font: 600 10.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.markdown { margin-top: 12px; overflow-wrap: anywhere; }
.markdown p { margin: 0 0 10px; }
.markdown p:last-child { margin-bottom: 0; }
code, pre { font-family: var(--mono); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; }
code { padding: 1px 5px; font-size: 13px; }
pre { margin: 10px 0; padding: 12px; overflow-x: auto; white-space: pre-wrap; font-size: 13px; }
.reveal { margin-top: 22px; }
.reveal summary { width: fit-content; cursor: pointer; color: var(--accent); font-size: 13px; list-style: none; }
.reveal summary::-webkit-details-marker { display: none; }
.reveal summary:hover { color: var(--text); }
.notes { margin-top: 12px; padding: 14px; background: var(--panel2); border-radius: 6px; }
.history-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.count { color: var(--faint); font: 11px/1.4 var(--mono); }
.attempts { display: grid; gap: 10px; }
.attempt { padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.attempt-top { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 10px; }
.rating { min-width: 24px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font: 700 11px/1.2 var(--mono); }
.rating[data-rating="0"] { color: var(--red); }
.rating[data-rating="1"] { color: var(--yellow); }
.rating[data-rating="2"] { color: var(--green); }
.rating[data-rating="3"] { color: var(--accent); }
.meta { color: var(--faint); font: 11px/1.4 var(--mono); }
.variant { color: var(--purple); }
.attempt-section { margin-top: 12px; }
.attempt-section .label { font-size: 10px; }
.feedback { color: var(--dim); }
.empty { padding: 18px 0; color: var(--faint); }
@media (max-width: 440px) { .header, .content, .history { padding: 20px 18px; } .stat { padding: 0 8px; } }
</style>
</head>
<body>
<main class="card">
  <header class="header">
    <div class="identity"><span class="atom-id" id="atomId">—</span><h1 id="topic">Untitled atom</h1></div>
    <div class="tags" id="tags"></div>
    <div class="stats" id="stats"></div>
  </header>
  <section class="content">
    <div class="label">Prompt</div>
    <div class="markdown" id="userPrompt"></div>
    <details class="reveal"><summary>Show agent notes</summary><div class="notes markdown" id="agentPrompt"></div></details>
  </section>
  <section class="history">
    <div class="history-head"><div class="label">Attempt history</div><div class="count" id="attemptCount"></div></div>
    <div class="attempts" id="attempts"></div>
  </section>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const atom = data.atom && typeof data.atom === 'object' ? data.atom : {};
  const $ = id => document.getElementById(id);
  const text = value => value == null || value === '' ? '—' : String(value);
  const whole = value => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : 0;
  const mdLite = value => {
    const escaped = String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const parts = escaped.split(/```([\s\S]*?)```/g);
    return parts.map((part, index) => index % 2
      ? `<pre>${part.replace(/^[a-zA-Z0-9_+-]*\n/, '').replace(/^\n|\n$/g, '')}</pre>`
      : part.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').split(/\n{2,}/).filter(Boolean).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')
    ).join('');
  };
  const addMarkdown = (node, value) => { node.innerHTML = mdLite(value); };

  $('atomId').textContent = text(atom.id);
  $('topic').textContent = atom.topic || 'Untitled atom';
  addMarkdown($('userPrompt'), atom.user_prompt || 'No prompt provided.');
  addMarkdown($('agentPrompt'), atom.agent_prompt || 'No agent notes provided.');

  const tags = Array.isArray(atom.tags) ? atom.tags : [];
  tags.forEach(value => { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = String(value); $('tags').append(tag); });
  if (!tags.length) $('tags').hidden = true;

  const stats = [
    ['state', atom.state || 'unknown', 'pill'],
    ['streak', whole(atom.streak), ''],
    ['lapses', whole(atom.lapses), ''],
    ['last rating', atom.last_rating == null ? '—' : atom.last_rating, '']
  ];
  stats.forEach(([label, value, className]) => {
    const item = document.createElement('span'); item.className = `stat ${className}`.trim();
    const strong = document.createElement('strong'); strong.textContent = String(value);
    item.append(`${label} `, strong); $('stats').append(item);
  });

  const attempts = Array.isArray(atom.attempts) ? [...atom.attempts].reverse() : [];
  $('attemptCount').textContent = `${attempts.length} ${attempts.length === 1 ? 'attempt' : 'attempts'}`;
  if (!attempts.length) {
    const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'No attempts yet'; $('attempts').append(empty);
    return;
  }
  attempts.forEach(attemptValue => {
    const attempt = attemptValue && typeof attemptValue === 'object' ? attemptValue : {};
    const card = document.createElement('article'); card.className = 'attempt';
    const top = document.createElement('div'); top.className = 'attempt-top';
    const rating = document.createElement('span'); rating.className = 'rating';
    const ratingValue = [0, 1, 2, 3].includes(Number(attempt.rating)) ? String(Number(attempt.rating)) : '—';
    rating.dataset.rating = ratingValue; rating.textContent = ratingValue;
    const timestamp = document.createElement('span'); timestamp.className = 'meta'; timestamp.textContent = text(attempt.ts);
    top.append(rating, timestamp);
    if (attempt.via) { const via = document.createElement('span'); via.className = 'meta'; via.textContent = `via ${attempt.via}`; top.append(via); }
    if (attempt.variant) { const variant = document.createElement('span'); variant.className = 'meta variant'; variant.textContent = String(attempt.variant); top.append(variant); }
    card.append(top);

    const section = (label, value, className = '') => {
      if (value == null || value === '') return;
      const wrap = document.createElement('div'); wrap.className = `attempt-section ${className}`.trim();
      const heading = document.createElement('div'); heading.className = 'label'; heading.textContent = label;
      const body = document.createElement('div'); body.className = 'markdown'; addMarkdown(body, value);
      wrap.append(heading, body); card.append(wrap);
    };
    section('Answer', attempt.answer);
    section('Feedback', attempt.feedback, 'feedback');
    $('attempts').append(card);
  });
})();
</script>
</body>
</html>
