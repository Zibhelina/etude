<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etude · Flashcard drill</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  display: grid; place-items: center; padding: 24px;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.shell { width: min(760px, 100%); }
.topline { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 12px; }
.eyebrow { color: var(--accent); font: 700 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.queue { margin-top: 7px; color: var(--dim); font-size: 14px; }
.counter { color: var(--dim); font: 600 13px/1 var(--mono); }
.track { height: 5px; overflow: hidden; background: var(--panel2); border-radius: 99px; margin-bottom: 18px; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.card {
  min-height: 390px; padding: clamp(28px, 6vw, 54px); background: var(--panel);
  border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column;
  box-shadow: 0 16px 50px var(--bg);
}
.topic { min-height: 18px; color: var(--purple); font: 700 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.prompt { flex: 1; display: grid; place-items: center; text-align: center; font-size: clamp(25px, 5vw, 39px); line-height: 1.35; letter-spacing: -.02em; overflow-wrap: anywhere; }
.prompt code, .answer code { padding: .08em .28em; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; font-family: var(--mono); font-size: .82em; }
.controls { display: grid; gap: 12px; }
.answer-row { display: flex; gap: 10px; }
input {
  min-width: 0; flex: 1; padding: 14px 16px; color: var(--text); background: var(--panel2);
  border: 1px solid var(--border); border-radius: 11px;
}
button { cursor: pointer; border: 1px solid var(--border); border-radius: 11px; padding: 13px 17px; color: var(--text); background: var(--panel2); font-weight: 700; }
button:hover { border-color: var(--accent); }
.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.secondary { align-self: center; color: var(--dim); background: var(--panel); border-color: var(--panel); font-size: 13px; padding: 6px; }
.feedback { padding: 14px 16px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel2); line-height: 1.45; }
.feedback.right { border-color: var(--green); }
.feedback.wrong { border-color: var(--red); }
.feedback strong { color: var(--text); }
.feedback .label { color: var(--dim); font-size: 13px; }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wrong-button { border-color: var(--red); }
.right-button { border-color: var(--green); }
.end { text-align: center; justify-content: center; gap: 20px; }
.end h1 { margin: 0; font-size: clamp(32px, 7vw, 50px); }
.score { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.chip { padding: 9px 13px; background: var(--panel2); border: 1px solid var(--border); border-radius: 99px; font: 700 13px/1 var(--mono); }
.good { color: var(--green); } .bad { color: var(--red); } .unsent { color: var(--yellow); }
.end-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.hint { margin: 14px 0 0; text-align: center; color: var(--faint); font: 12px/1.5 var(--mono); }
.hidden { display: none !important; }
@media (max-width: 560px) { body { padding: 14px; } .card { min-height: 430px; } .answer-row { flex-direction: column; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="shell">
  <header class="topline">
    <div><div class="eyebrow">Etude · Drill</div><div class="queue" id="queueLabel"></div></div>
    <div class="counter" id="counter"></div>
  </header>
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <section class="card" id="card" aria-live="polite">
    <div class="topic" id="topic"></div>
    <div class="prompt" id="prompt"></div>
    <div class="controls" id="controls"></div>
  </section>
  <p class="hint" id="hint">Enter to check · choose “show answer” to self-grade</p>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE || {};
  const original = Array.isArray(data.atoms) ? data.atoms.slice() : [];
  let deck = original.slice(), index = 0, right = 0, wrong = 0, wrongCards = [], unsent = [], busy = false, selfMode = false;
  const $ = id => document.getElementById(id);

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function lightMarkdown(value) {
    let html = escapeHtml(value);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return html.replace(/\r?\n/g, '<br>');
  }
  function accepted(atom) {
    if (atom.expected == null) return [];
    return (Array.isArray(atom.expected) ? atom.expected : [atom.expected]).map(String);
  }
  function normalize(value) { return String(value).trim().toLocaleLowerCase(); }
  function updateProgress() {
    $('counter').textContent = deck.length ? `${Math.min(index + 1, deck.length)} / ${deck.length}` : '0 / 0';
    $('fill').style.width = `${deck.length ? (index / deck.length) * 100 : 0}%`;
  }
  function button(label, className, handler) {
    const el = document.createElement('button'); el.type = 'button'; el.textContent = label; el.className = className || ''; el.addEventListener('click', handler); return el;
  }
  async function postAttempt(body) {
    if (!data.api) { unsent.push(body); return false; }
    try {
      const response = await fetch(`${String(data.api).replace(/\/$/, '')}/api/attempts`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return true;
    } catch (_) { unsent.push(body); return false; }
  }
  async function retryUnsent() {
    if (!unsent.length || !data.api) return;
    const pending = unsent.slice(); unsent = [];
    for (const body of pending) await postAttempt(body);
  }
  function attemptBody(atom, answer, rating) {
    const body = {atom_id: atom.id, answer, via: 'applet', mode: 'applet'};
    if (rating != null) body.rating = rating;
    return body;
  }
  function render() {
    busy = false; selfMode = false; updateProgress();
    if (index >= deck.length) { renderEnd(); return; }
    const atom = deck[index];
    $('card').className = 'card'; $('topic').textContent = atom.topic || '';
    $('prompt').innerHTML = lightMarkdown(atom.user_prompt || '');
    $('controls').replaceChildren(); $('hint').textContent = 'Enter to check · choose “show answer” to self-grade';
    const answers = accepted(atom);
    if (answers.length) renderTyped(atom, answers); else renderFlip(atom, answers);
  }
  function renderTyped(atom, answers) {
    const row = document.createElement('form'); row.className = 'answer-row';
    const input = document.createElement('input'); input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
    input.placeholder = 'Type your answer…'; input.setAttribute('aria-label', 'Your answer');
    const submit = button('Check', 'primary'); submit.type = 'submit'; row.append(input, submit);
    row.addEventListener('submit', async event => {
      event.preventDefault(); if (busy || !input.value.trim()) return; busy = true;
      input.disabled = true; submit.disabled = true;
      const isRight = answers.some(answer => normalize(answer) === normalize(input.value));
      recordResult(atom, isRight);
      await postAttempt(attemptBody(atom, input.value));
      showTypedFeedback(isRight, answers);
    });
    $('controls').append(row, button('Show answer · self-grade instead', 'secondary', () => renderFlip(atom, answers)));
    setTimeout(() => input.focus(), 0);
  }
  function showTypedFeedback(isRight, answers) {
    const box = document.createElement('div'); box.className = `feedback ${isRight ? 'right' : 'wrong'}`;
    box.innerHTML = `<strong>${isRight ? 'Right' : 'Not quite'}</strong><br><span class="label">Accepted: ${answers.map(lightMarkdown).join(' · ')}</span>`;
    const next = button(index + 1 < deck.length ? 'Next card' : 'See summary', 'primary', advance);
    $('controls').replaceChildren(box, next); $('hint').textContent = 'Enter for next card'; next.focus();
  }
  function renderFlip(atom, answers) {
    selfMode = true; $('controls').replaceChildren();
    const show = button('Show answer', 'primary', () => {
      const box = document.createElement('div'); box.className = 'feedback';
      const display = answers.length ? answers.map(lightMarkdown).join(' · ') : 'No reference answer provided.';
      box.innerHTML = `<span class="label">Answer</span><br><strong class="answer">${display}</strong>`;
      const grades = document.createElement('div'); grades.className = 'grades';
      grades.append(button('Wrong · 1', 'wrong-button', () => selfGrade(atom, false)), button('Right · 3', 'right-button', () => selfGrade(atom, true)));
      $('controls').replaceChildren(box, grades); $('hint').textContent = 'Press 1 for wrong · 3 for right';
    });
    $('controls').append(show);
    if (answers.length) $('controls').append(button('Type answer instead', 'secondary', () => { selfMode = false; renderTyped(atom, answers); }));
    $('hint').textContent = 'Space or Enter to reveal'; show.focus();
  }
  function recordResult(atom, isRight) {
    if (isRight) right += 1; else { wrong += 1; wrongCards.push(atom); }
  }
  async function selfGrade(atom, isRight) {
    if (busy) return; busy = true; recordResult(atom, isRight);
    await postAttempt(attemptBody(atom, '(self-graded)', isRight ? 3 : 0)); advance();
  }
  function advance() { index += 1; render(); }
  async function renderEnd() {
    $('fill').style.width = '100%'; $('counter').textContent = `${deck.length} / ${deck.length}`; $('topic').textContent = '';
    await retryUnsent();
    $('card').className = 'card end';
    const uniqueWrong = [...new Map(wrongCards.map(atom => [atom.id, atom])).values()];
    $('card').innerHTML = `<div class="eyebrow">Session complete</div><h1>${right + wrong ? Math.round(right / (right + wrong) * 100) : 0}% correct</h1><div class="score"><span class="chip good">${right} right</span><span class="chip bad">${wrong} wrong</span><span class="chip unsent">${unsent.length} unsent</span></div><div class="end-actions" id="endActions"></div>`;
    const actions = $('endActions');
    if (uniqueWrong.length) actions.append(button('Retry wrong cards', 'primary', () => { deck = uniqueWrong; index = right = wrong = 0; wrongCards = []; render(); }));
    if (unsent.length) actions.append(button('Retry unsent attempts', '', async () => { await retryUnsent(); renderEnd(); }));
    actions.append(button('Restart all', '', () => { deck = original.slice(); index = right = wrong = 0; wrongCards = []; render(); }));
    $('hint').textContent = unsent.length ? 'Some attempts could not reach Etude. Keep this page open and retry.' : 'All attempts saved.';
  }
  document.addEventListener('keydown', event => {
    if (event.target instanceof HTMLInputElement) return;
    if (event.key === 'Enter' || (event.key === ' ' && selfMode)) {
      const focused = document.activeElement;
      if (focused instanceof HTMLButtonElement) { event.preventDefault(); focused.click(); }
    }
    if (selfMode && (event.key === '1' || event.key === '3')) {
      const buttons = [...document.querySelectorAll('.grades button')];
      const chosen = event.key === '1' ? buttons[0] : buttons[1]; if (chosen) chosen.click();
    }
  });
  $('queueLabel').textContent = data.queue_label || data.queue || 'Practice queue';
  render();
})();
</script>
</body>
</html>
