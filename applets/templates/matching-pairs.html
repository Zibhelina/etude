<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etude · Matching pairs</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font-family: var(--sans); display: grid; place-items: center; }
button { font: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.shell { width: min(860px, 100%); }
header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 22px; }
.eyebrow { color: var(--accent); font: 700 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: 8px 0 0; font-size: clamp(25px, 5vw, 38px); letter-spacing: -.025em; }
.meta { color: var(--dim); font: 600 13px/1.4 var(--mono); text-align: right; }
.board { padding: clamp(18px, 4vw, 32px); background: var(--panel); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 16px 50px var(--bg); }
.instructions { margin: 0 0 22px; color: var(--dim); line-height: 1.5; }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px clamp(18px, 5vw, 46px); }
.column { display: grid; align-content: start; gap: 10px; }
.pair {
  min-height: 62px; padding: 13px 16px; border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); background: var(--panel2); cursor: pointer; font-size: clamp(16px, 2.5vw, 19px); line-height: 1.35;
  transition: transform .14s ease, border-color .14s ease, opacity .14s ease;
}
.pair:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.pair.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pair.matched { color: var(--green); border-color: var(--green); background: var(--panel); cursor: default; opacity: .76; }
.pair.mismatch { color: var(--red); border-color: var(--red); animation: shake .25s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; }
.status { color: var(--dim); font: 13px/1.4 var(--mono); }
.submit { padding: 13px 20px; color: var(--bg); background: var(--accent); border: 1px solid var(--accent); border-radius: 11px; cursor: pointer; font-weight: 800; }
.submit:disabled { color: var(--faint); background: var(--panel2); border-color: var(--border); cursor: not-allowed; }
.confirmation { min-height: 420px; padding: 40px; display: grid; place-items: center; text-align: center; background: var(--panel); border: 1px solid var(--green); border-radius: 20px; }
.confirmation h2 { margin: 14px 0 8px; font-size: clamp(28px, 5vw, 42px); }
.confirmation p { max-width: 520px; margin: 0; color: var(--dim); font-size: 18px; line-height: 1.55; }
.check { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; color: var(--bg); background: var(--green); font-size: 28px; font-weight: 900; }
.error { color: var(--red); }
.hidden { display: none; }
@media (max-width: 600px) { body { padding: 14px; } header { align-items: start; flex-direction: column; } .meta { text-align: left; } .columns { gap: 10px; } .pair { min-height: 70px; padding: 10px; } .footer { align-items: stretch; flex-direction: column; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="shell">
  <header><div><div class="eyebrow">Etude · Match</div><h1 id="title">Connect the pairs</h1></div><div class="meta" id="meta"></div></header>
  <section class="board" id="board">
    <p class="instructions" id="instructions">Choose one item from each column. Matched pairs lock in place.</p>
    <div class="columns"><div class="column" id="leftColumn" aria-label="Left choices"></div><div class="column" id="rightColumn" aria-label="Right choices"></div></div>
    <div class="footer"><div class="status" id="status" aria-live="polite"></div><button class="submit" id="submit" type="button">Submit</button></div>
  </section>
  <section class="confirmation hidden" id="confirmation" aria-live="polite"></section>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  // Matching payload extension: ETUDE.pairs is an array of [left, right] tuples;
  // ETUDE.atoms[0] is the agent-assisted atom that owns the exercise.
  const data = ETUDE || {}, atom = Array.isArray(data.atoms) ? data.atoms[0] : null;
  const sourcePairs = Array.isArray(data.pairs) ? data.pairs.filter(pair => Array.isArray(pair) && pair.length >= 2) : [];
  const startedAt = Date.now();
  let selectedLeft = null, selectedRight = null, mismatchCount = 0, locked = new Set(), proposals = [], resolving = false, sent = false;
  const $ = id => document.getElementById(id);
  const shuffle = values => {
    const result = values.slice();
    for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; }
    return result;
  };
  const entries = sourcePairs.map((pair, index) => ({index, left: String(pair[0]), right: String(pair[1])}));
  const leftItems = shuffle(entries.map(entry => ({id: entry.index, value: entry.left})));
  const rightItems = shuffle(entries.map(entry => ({id: entry.index, value: entry.right})));

  function makeChoice(side, item) {
    const button = document.createElement('button'); button.type = 'button'; button.className = 'pair';
    button.textContent = item.value; button.dataset.id = String(item.id); button.dataset.side = side;
    button.addEventListener('click', () => choose(button, side, item)); return button;
  }
  function choose(button, side, item) {
    if (resolving || locked.has(item.id) || button.disabled) return;
    const previous = side === 'left' ? selectedLeft : selectedRight;
    if (previous) previous.button.classList.remove('selected');
    button.classList.add('selected');
    if (side === 'left') selectedLeft = {button, item}; else selectedRight = {button, item};
    if (selectedLeft && selectedRight) resolveSelection();
  }
  function resolveSelection() {
    resolving = true;
    const left = selectedLeft, right = selectedRight;
    proposals.push([left.item.value, right.item.value]);
    if (left.item.id === right.item.id) {
      locked.add(left.item.id);
      for (const choice of [left.button, right.button]) { choice.classList.remove('selected'); choice.classList.add('matched'); choice.disabled = true; }
      clearSelection(); updateStatus(); resolving = false;
      if (locked.size === entries.length) submit();
    } else {
      mismatchCount += 1;
      left.button.classList.add('mismatch'); right.button.classList.add('mismatch'); updateStatus('Not a match — try again.');
      setTimeout(() => {
        for (const choice of [left.button, right.button]) choice.classList.remove('selected', 'mismatch');
        clearSelection(); resolving = false; updateStatus();
      }, 520);
    }
  }
  function clearSelection() { selectedLeft = selectedRight = null; }
  function updateStatus(message) {
    $('status').textContent = message || `${locked.size} of ${entries.length} matched · ${mismatchCount} ${mismatchCount === 1 ? 'mismatch' : 'mismatches'}`;
    $('submit').disabled = sent || !atom || !entries.length;
    $('submit').textContent = locked.size === entries.length ? 'Send to agent' : 'Submit current work';
  }
  async function submit() {
    if (sent || !atom || !entries.length) return;
    sent = true; $('submit').disabled = true; $('submit').textContent = 'Sending…'; updateStatus('Sending your work…');
    const body = {atom_id: atom.id, payload: {matches: proposals.slice(), mismatch_count: mismatchCount, duration_s: Math.max(0, Math.round((Date.now() - startedAt) / 1000))}, ts: new Date().toISOString()};
    try {
      const response = await fetch(`${String(data.api || '').replace(/\/$/, '')}/api/inbox`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      $('board').classList.add('hidden'); $('confirmation').classList.remove('hidden');
      $('confirmation').innerHTML = '<div><div class="check" aria-hidden="true">✓</div><h2>Sent to your agent</h2><p>Your matching attempt is waiting in Etude. Tell your agent you are done so they can review it with you.</p></div>';
    } catch (_) {
      sent = false; $('submit').disabled = false; $('submit').textContent = 'Retry send';
      $('status').innerHTML = '<span class="error">Could not reach Etude. Your work is still here — retry when the server is available.</span>';
    }
  }
  $('leftColumn').append(...leftItems.map(item => makeChoice('left', item)));
  $('rightColumn').append(...rightItems.map(item => makeChoice('right', item)));
  $('title').textContent = (atom && atom.topic) || 'Connect the pairs';
  $('instructions').textContent = (atom && atom.user_prompt) || 'Choose one item from each column. Matched pairs lock in place.';
  $('meta').textContent = data.queue_label || data.queue || 'Agent-assisted exercise';
  $('submit').addEventListener('click', submit);
  updateStatus(entries.length ? '' : 'No matching pairs were provided.');
})();
</script>
</body>
</html>
