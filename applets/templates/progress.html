<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etude · Progress</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; padding: clamp(18px, 4vw, 42px); background: var(--bg); color: var(--text); font-family: var(--sans); }
.shell { width: min(1040px, 100%); margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
.eyebrow { color: var(--accent); font: 700 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: 8px 0 0; font-size: clamp(32px, 6vw, 52px); letter-spacing: -.04em; }
.scope { color: var(--dim); font: 600 13px/1.4 var(--mono); text-align: right; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.panel { padding: 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; }
.summary { grid-column: span 4; min-height: 160px; }
.queues { grid-column: span 8; grid-row: span 2; }
.ratings { grid-column: span 4; }
.activity { grid-column: 1 / -1; }
.label { color: var(--dim); font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.big { margin-top: 13px; font-size: clamp(42px, 7vw, 64px); font-weight: 800; letter-spacing: -.05em; }
.sub { margin-top: 4px; color: var(--dim); }
h2 { margin: 0 0 20px; font-size: 18px; }
.queue-list { display: grid; gap: 20px; }
.queue-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 9px; }
.queue-name { font-weight: 700; overflow-wrap: anywhere; }
.queue-count { flex: none; color: var(--dim); font: 12px/1.4 var(--mono); }
.track { height: 8px; overflow: hidden; background: var(--panel2); border-radius: 99px; }
.fill { height: 100%; background: var(--accent); border-radius: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 9px; }
.chip { padding: 9px 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 99px; font: 700 12px/1 var(--mono); }
.chip[data-rating="0"] { color: var(--red); } .chip[data-rating="1"] { color: var(--yellow); } .chip[data-rating="2"] { color: var(--accent); } .chip[data-rating="3"] { color: var(--green); }
.chart-wrap { overflow-x: auto; padding-top: 8px; }
.chart { min-width: 420px; height: 170px; display: flex; align-items: end; gap: clamp(4px, 1vw, 10px); border-bottom: 1px solid var(--border); }
.day { flex: 1; min-width: 7px; height: 100%; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 7px; }
.bar { width: 100%; min-height: 2px; background: var(--purple); border-radius: 5px 5px 0 0; }
.day-label { height: 16px; color: var(--faint); font: 10px/1 var(--mono); white-space: nowrap; }
.empty { color: var(--faint); line-height: 1.6; }
@media (max-width: 760px) { header { align-items: start; flex-direction: column; } .scope { text-align: left; } .summary, .queues, .ratings { grid-column: 1 / -1; } .queues { grid-row: auto; } }
</style>
</head>
<body>
<main class="shell">
  <header><div><div class="eyebrow">Etude · Progress</div><h1>Practice, in motion.</h1></div><div class="scope" id="scope"></div></header>
  <div class="grid">
    <section class="panel summary"><div class="label">Mastery</div><div class="big" id="mastery">—</div><div class="sub" id="coverage"></div></section>
    <section class="panel queues"><h2>Queue progress</h2><div class="queue-list" id="queues"></div></section>
    <section class="panel ratings"><h2>Rating distribution</h2><div class="chips" id="ratings"></div></section>
    <section class="panel activity"><h2 id="activityTitle">Daily activity</h2><div class="chart-wrap"><div class="chart" id="chart"></div></div></section>
  </div>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE || {}, stats = data.stats && typeof data.stats === 'object' ? data.stats : {};
  const $ = id => document.getElementById(id);
  const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
  const percent = value => {
    const n = number(value, NaN); if (!Number.isFinite(n)) return null;
    return Math.max(0, Math.min(100, n <= 1 ? n * 100 : n));
  };
  const asArray = value => Array.isArray(value) ? value : (value && typeof value === 'object' ? Object.entries(value).map(([id, item]) => ({id, ...(typeof item === 'object' ? item : {value:item})})) : []);

  const mastery = percent(stats.mastery);
  $('mastery').textContent = mastery == null ? '—' : `${Math.round(mastery)}%`;
  const total = number(stats.total, 0), seen = number(stats.seen, 0);
  $('coverage').textContent = total ? `${seen.toLocaleString()} of ${total.toLocaleString()} atoms seen` : (seen ? `${seen.toLocaleString()} atoms seen` : 'No coverage data yet');
  $('scope').textContent = data.queue_label || data.queue || 'All active queues';

  const queueData = asArray(stats.queues || stats.per_queue || data.queues);
  if (!queueData.length) $('queues').innerHTML = '<div class="empty">No queue progress was provided.</div>';
  else queueData.forEach((queue, index) => {
    const done = number(queue.done ?? queue.seen ?? queue.completed, 0), queueTotal = number(queue.total, 0);
    const ratio = queueTotal ? Math.max(0, Math.min(100, done / queueTotal * 100)) : 0;
    const row = document.createElement('div'); row.className = 'queue-row';
    const head = document.createElement('div'); head.className = 'queue-head';
    const name = document.createElement('div'); name.className = 'queue-name'; name.textContent = queue.label || queue.name || queue.id || `Queue ${index + 1}`;
    const count = document.createElement('div'); count.className = 'queue-count'; count.textContent = `${done} / ${queueTotal}`;
    const track = document.createElement('div'); track.className = 'track'; track.setAttribute('role', 'progressbar'); track.setAttribute('aria-valuemin', '0'); track.setAttribute('aria-valuemax', String(queueTotal)); track.setAttribute('aria-valuenow', String(done));
    const fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = `${ratio}%`;
    head.append(name, count); track.append(fill); row.append(head, track); $('queues').append(row);
  });

  const distribution = stats.rating_distribution || stats.ratings || stats.rating_dist || {};
  const ratingNames = ['Fail', 'Hard', 'Good', 'Easy'];
  const ratingEntries = [0,1,2,3].map(rating => [rating, number(distribution[rating] ?? distribution[String(rating)], 0)]);
  if (!ratingEntries.some(([, count]) => count)) $('ratings').innerHTML = '<div class="empty">No ratings yet.</div>';
  else ratingEntries.forEach(([rating, count]) => {
    const chip = document.createElement('span'); chip.className = 'chip'; chip.dataset.rating = String(rating); chip.textContent = `${ratingNames[rating]} ${count}`; $('ratings').append(chip);
  });

  let activity = asArray(stats.activity || stats.per_day || stats.daily);
  const requestedDays = Math.max(0, Math.floor(number(stats.days, activity.length)));
  if (requestedDays && activity.length > requestedDays) activity = activity.slice(-requestedDays);
  $('activityTitle').textContent = `Daily activity${requestedDays ? ` · last ${requestedDays} days` : ''}`;
  if (!activity.length) $('chart').innerHTML = '<div class="empty">No daily activity was provided.</div>';
  else {
    const counts = activity.map(day => number(day.count ?? day.attempts ?? day.total ?? day.value, 0));
    const max = Math.max(1, ...counts);
    activity.forEach((day, index) => {
      const date = String(day.date || day.day || day.id || ''); const count = counts[index];
      const cell = document.createElement('div'); cell.className = 'day'; cell.title = `${date || 'Day'}: ${count} attempts`;
      const bar = document.createElement('div'); bar.className = 'bar'; bar.style.height = `${Math.max(2, count / max * 138)}px`; bar.setAttribute('aria-label', cell.title);
      const label = document.createElement('div'); label.className = 'day-label'; label.textContent = (index === 0 || index === activity.length - 1 || activity.length <= 10 || index % 5 === 0) ? date.slice(5) : '';
      cell.append(bar, label); $('chart').append(cell);
    });
  }
})();
</script>
</body>
</html>
