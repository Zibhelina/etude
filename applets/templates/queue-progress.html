<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etude · Queue progress</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
.wrap { display: flex; flex-direction: column; padding: 22px 26px 20px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.label { color: var(--faint); font: 600 10.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: 2px 0 0; font-size: 19px; line-height: 1.3; letter-spacing: -.01em; overflow-wrap: anywhere; }
.hero { display: flex; align-items: baseline; gap: 8px; margin-top: 18px; }
.hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.hero .of { color: var(--faint); font-size: 16px; }
.hero .pct { margin-left: auto; color: var(--dim); font: 600 13px/1 var(--mono); }
.track { width: 100%; height: 10px; margin-top: 12px; overflow: hidden; background: var(--panel2); border-radius: 999px; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.stats { display: flex; gap: 0; margin-top: 14px; color: var(--dim); font-size: 13px; }
.stats span + span::before { content: '·'; margin: 0 8px; color: var(--faint); }
.stats b { color: var(--text); font-weight: 600; }
.bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
.mastery { flex: 1; min-width: 0; }
.mastery .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.mastery .row .t { font-size: 13px; font-weight: 600; }
.mastery .row .v { color: var(--dim); font: 600 12px/1 var(--mono); }
.mastery .track { height: 6px; margin-top: 0; }
.mastery .fill { background: var(--green); }
.chips { display: flex; gap: 6px; flex-shrink: 0; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 40px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.chip .n { font: 700 14px/1.1 var(--mono); }
.chip .r { color: var(--faint); font: 600 9.5px/1 var(--sans); letter-spacing: .06em; }
.chip[data-rating="0"] .n { color: var(--red); }
.chip[data-rating="1"] .n { color: var(--yellow); }
.chip[data-rating="2"] .n { color: var(--green); }
.chip[data-rating="3"] .n { color: var(--accent); }
@media (max-width: 480px) { .bottom { flex-direction: column; align-items: stretch; } .chips { justify-content: space-between; } }
</style>
</head>
<body data-fit-content>
<div class="wrap">
  <div class="top">
    <div>
      <div class="label">Queue progress</div>
      <h1 id="queueLabel">Untitled queue</h1>
    </div>
  </div>
  <div class="hero">
    <span class="big" id="seenBig">0</span>
    <span class="of" id="ofTotal">/ 0 practiced</span>
    <span class="pct" id="coveragePercent">0%</span>
  </div>
  <div class="track" role="progressbar" aria-label="Queue coverage" id="coverageTrack"><div class="fill" id="coverageFill"></div></div>
  <div class="stats" id="statsLine"></div>
  <div class="bottom">
    <div class="mastery">
      <div class="row"><span class="t">Mastery</span><span class="v" id="masteryPercent">0%</span></div>
      <div class="track" role="progressbar" aria-label="Queue mastery" id="masteryTrack"><div class="fill" id="masteryFill"></div></div>
    </div>
    <div class="chips" id="ratings" aria-label="Rating distribution"></div>
  </div>
</div>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const stats = data.stats && typeof data.stats === 'object' ? data.stats : {};
  const $ = id => document.getElementById(id);
  const num = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
  const whole = value => Math.max(0, Math.floor(num(value)));
  const ratio = value => Math.max(0, Math.min(1, num(value)));

  const total = whole(stats.total);
  const seen = Math.min(total || whole(stats.seen), whole(stats.seen));
  const remaining = Number.isFinite(Number(stats.remaining)) ? whole(stats.remaining) : Math.max(0, total - seen);
  const coverage = total ? ratio(seen / total) : 0;
  const mastery = ratio(stats.mastery);

  $('queueLabel').textContent = data.queue_label || data.queue || 'Untitled queue';
  $('seenBig').textContent = seen.toLocaleString();
  $('ofTotal').textContent = `/ ${total.toLocaleString()} practiced`;
  $('statsLine').innerHTML = `<span><b>${remaining.toLocaleString()}</b> remaining</span><span><b>${total.toLocaleString()}</b> total</span>`;

  function setProgress(trackId, fillId, value, textId) {
    const percent = Math.round(value * 100);
    $(fillId).style.width = `${percent}%`;
    $(textId).textContent = `${percent}%`;
    const track = $(trackId);
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', '100');
    track.setAttribute('aria-valuenow', String(percent));
  }
  setProgress('coverageTrack', 'coverageFill', coverage, 'coveragePercent');
  setProgress('masteryTrack', 'masteryFill', mastery, 'masteryPercent');

  const dist = stats.rating_dist && typeof stats.rating_dist === 'object' ? stats.rating_dist : {};
  const names = ['fail', 'hard', 'good', 'easy'];
  [0, 1, 2, 3].forEach(rating => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.rating = String(rating);
    chip.innerHTML = `<span class="n">${whole(dist[String(rating)] ?? dist[rating])}</span><span class="r">${names[rating]}</span>`;
    $('ratings').append(chip);
  });
})();
</script>
</body>
</html>
