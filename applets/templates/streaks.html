<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Practice streak</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 16px/1.7 var(--sans); }
.wrap { display: flex; flex-direction: column; padding: 22px 26px 20px; }
.label { color: var(--text-muted); font: 500 13px/1.3 var(--sans); letter-spacing: .01em; }
h1 { margin: 2px 0 0; font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.grid { display: flex; gap: 3px; margin-top: 20px; }
.cell { flex: 1 1 0; min-width: 0; aspect-ratio: 1; max-height: 18px; background: var(--surface-2); border-radius: 3px; }
.cell[data-level="1"] { background: color-mix(in srgb, var(--green) 30%, var(--surface-2)); }
.cell[data-level="2"] { background: color-mix(in srgb, var(--green) 62%, var(--surface-2)); }
.cell[data-level="3"] { background: var(--green); }
.dates { display: flex; justify-content: space-between; margin-top: 8px; color: var(--text-muted); font: 500 11px/1.4 var(--mono); }
.stats { display: flex; margin-top: 24px; padding-top: 18px; border-top: 0.5px solid var(--border); }
.stat { flex: 1; min-width: 0; }
.stat + .stat { padding-left: 22px; border-left: 0.5px solid var(--border); margin-left: 22px; }
.stat .v { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
.stat .k { margin-top: 2px; color: var(--text-secondary); font-size: 12.5px; }
</style>
</head>
<body data-fit-content>
<div class="wrap">
  <div class="label">Etude activity</div>
  <h1>Practice streak</h1>
  <div class="grid" id="grid" role="img" aria-label="Daily practice activity"></div>
  <div class="dates"><span id="dateStart"></span><span id="dateEnd"></span></div>
  <div class="stats">
    <div class="stat"><div class="v"><span id="currentStreak">0</span><small>days</small></div><div class="k">Current streak</div></div>
    <div class="stat"><div class="v"><span id="bestStreak">0</span><small>days</small></div><div class="k">Best streak</div></div>
    <div class="stat"><div class="v"><span id="totalAttempts">0</span></div><div class="k">Total attempts</div></div>
  </div>
</div>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const stats = data.stats && typeof data.stats === 'object' ? data.stats : {};
  const $ = id => document.getElementById(id);
  const whole = value => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : 0;
  const perDay = Array.isArray(stats.per_day) ? stats.per_day.filter(d => d && typeof d === 'object') : [];

  const max = Math.max(1, ...perDay.map(d => whole(d.count)));
  const grid = $('grid');
  perDay.forEach(day => {
    const count = whole(day.count);
    const cell = document.createElement('div');
    cell.className = 'cell';
    let level = 0;
    if (count > 0) level = count >= max * 0.66 ? 3 : count >= max * 0.33 ? 2 : 1;
    cell.dataset.level = String(level);
    cell.title = `${day.date || ''} · ${count}`;
    grid.append(cell);
  });
  grid.setAttribute('aria-label', perDay.length
    ? `Daily practice activity: ${perDay.map(day => `${day.date || 'unknown date'}, ${whole(day.count)} attempts`).join('; ')}`
    : 'Daily practice activity: no attempts in this period');
  if (perDay.length) {
    $('dateStart').textContent = perDay[0].date || '';
    $('dateEnd').textContent = perDay[perDay.length - 1].date || '';
  }
  $('currentStreak').textContent = whole(stats.current_streak).toLocaleString();
  $('bestStreak').textContent = whole(stats.best_streak).toLocaleString();
  $('totalAttempts').textContent = whole(stats.total_attempts).toLocaleString();
})();
</script>
</body>
</html>
