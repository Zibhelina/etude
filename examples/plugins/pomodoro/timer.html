<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--card, transparent); color: var(--foreground, #e7e5e4); font-family: var(--font-sans, Inter, system-ui, sans-serif); user-select: none; overflow: hidden; }
  .card { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .tabs { display: flex; gap: 2px; background: var(--background, #111); padding: 2px; border-radius: 999px; border: 1px solid var(--border, #2a2a2a); }
  .tab { flex: 1; height: 24px; border: 0; border-radius: 999px; background: transparent; color: var(--foreground, #e7e5e4); font-size: 12px; font-weight: 500; cursor: pointer; }
  .tab.active { background: var(--phase-color); color: var(--phase-fg); font-weight: 600; }
  .ring-wrap { display: flex; justify-content: center; padding: 4px 0 0; }
  .ring { position: relative; width: 152px; height: 152px; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .clock { font-size: 40px; line-height: 1; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .phase-lbl { font-size: 12.5px; font-weight: 600; color: var(--phase-color); margin-top: 6px; text-align: center; }
  .dots { display: flex; justify-content: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: color-mix(in oklab, var(--foreground, #fff) 16%, transparent); }
  .dot.on { background: var(--primary, #22c55e); }
  .controls { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 36px; height: 36px; border: 0; border-radius: 999px; background: transparent; color: var(--foreground, #e7e5e4); cursor: pointer; display: grid; place-items: center; font-size: 15px; }
  .icon-btn:hover { background: var(--accent, rgba(255,255,255,0.08)); }
  .main-btn { flex: 1; height: 38px; border: 0; border-radius: 999px; background: var(--phase-color); color: var(--phase-fg); font-size: 14px; font-weight: 600; cursor: pointer; }
  .main-btn:hover { filter: brightness(1.08); }
  .row-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .link-btn { border: 0; background: transparent; color: var(--foreground, #e7e5e4); font-size: 12px; font-weight: 500; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .link-btn:hover { background: var(--accent, rgba(255,255,255,0.08)); }
  .setup { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border, #2a2a2a); padding-top: 10px; font-size: 12.5px; }
  .setup label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .setup input[type="number"] { width: 56px; height: 26px; border-radius: 6px; border: 1px solid var(--border, #2a2a2a); background: var(--background, #111); color: var(--foreground, #fff); text-align: right; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .pill { display: flex; align-items: center; gap: 8px; height: 42px; padding: 4px 6px 4px 10px; cursor: pointer; }
  .pill-clock { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; flex: 1; }
  .pill-btn { width: 30px; height: 30px; border: 0; border-radius: 999px; background: var(--phase-color); color: var(--phase-fg); font-size: 12px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const MIN = 60_000;
const PHASES = ["focus", "short", "long"];
const SHORT = { focus: "Focus", short: "Short", long: "Long" };
const FULL = { focus: "Focus", short: "Short break", long: "Long break" };
const COLOR = { focus: "var(--primary, #22c55e)", short: "#4aa3df", long: "#9a7cf0" };
const FG = { focus: "var(--primary-foreground, #000)", short: "#fff", long: "#fff" };
const DEFAULT = { phase: "focus", running: false, endsAt: null, left: 25 * MIN, done: 0, mins: { focus: 25, short: 5, long: 15 }, every: 4, auto: false, folded: false };

let state = { ...DEFAULT, mins: { ...DEFAULT.mins } };
let setup = false;
let lastNotifiedEnd = 0;

const total = (s, p = s.phase) => (s.mins[p] || 25) * MIN;
const remaining = (s, now) => (s.running && s.endsAt != null ? Math.max(0, s.endsAt - now) : s.left);
const fmt = (ms) => {
  const t = Math.ceil(ms / 1000);
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
};

async function save(next) {
  state = next;
  await etude.storage.set("state", state);
  resize();
  render();
}

function nextPhase(s, counted) {
  if (s.phase !== "focus") return { phase: "focus", done: s.done };
  const done = s.done + (counted ? 1 : 0);
  return { phase: counted && done % s.every === 0 ? "long" : "short", done };
}

function advance(s, now, counted) {
  const { phase, done } = nextPhase(s, counted);
  const next = { ...s, phase, done, running: false, endsAt: null, left: total(s, phase) };
  const from = counted && s.endsAt != null ? Math.min(now, s.endsAt) : now;
  return s.auto && counted ? { ...next, running: true, endsAt: from + total(next) } : next;
}

function resize() {
  if (state.folded) etude.floating.resize({ width: 156, height: 46 });
  else etude.floating.resize({ width: 272, height: setup ? 470 : 326 });
}

function render() {
  const now = Date.now();
  const left = remaining(state, now);
  const frac = Math.min(1, Math.max(0, 1 - left / total(state)));
  document.documentElement.style.setProperty("--phase-color", COLOR[state.phase]);
  document.documentElement.style.setProperty("--phase-fg", FG[state.phase]);
  const root = document.getElementById("root");

  if (state.folded) {
    const r = 9, c = 2 * Math.PI * r;
    root.innerHTML = `
      <div class="pill" id="unfold" title="Click to expand">
        <svg width="22" height="22" style="transform:rotate(-90deg)">
          <circle cx="11" cy="11" r="${r}" fill="none" stroke="color-mix(in oklab, var(--foreground, #fff) 16%, transparent)" stroke-width="3"></circle>
          <circle cx="11" cy="11" r="${r}" fill="none" stroke="${COLOR[state.phase]}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"></circle>
        </svg>
        <span class="pill-clock">${fmt(left)}</span>
        <button class="pill-btn" id="pill-toggle" aria-label="${state.running ? "Pause" : "Start"}">${state.running ? "❚❚" : "▶"}</button>
      </div>
    `;
    document.getElementById("unfold").onclick = (e) => {
      if (e.target.closest("button")) return;
      save({ ...state, folded: false });
    };
    document.getElementById("pill-toggle").onclick = (e) => {
      e.stopPropagation();
      toggle();
    };
    return;
  }

  const r = 72, c = 2 * Math.PI * r;
  const inCycle = state.phase === "long" && state.done > 0 && state.done % state.every === 0 ? state.every : state.done % state.every;
  const dots = Array.from({ length: state.every }, (_, i) => `<span class="dot ${i < inCycle ? "on" : ""}"></span>`).join("");

  root.innerHTML = `
    <div class="card">
      <div class="tabs">
        ${PHASES.map((p) => `<button class="tab ${state.phase === p ? "active" : ""}" data-phase="${p}">${SHORT[p]}</button>`).join("")}
      </div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="152" height="152">
            <circle cx="76" cy="76" r="${r}" fill="none" stroke="color-mix(in oklab, var(--foreground, #fff) 12%, transparent)" stroke-width="7"></circle>
            <circle cx="76" cy="76" r="${r}" fill="none" stroke="${COLOR[state.phase]}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"></circle>
          </svg>
          <div>
            <div class="clock" role="timer">${fmt(left)}</div>
            <div class="phase-lbl">${FULL[state.phase]}</div>
          </div>
        </div>
      </div>
      <div class="dots" title="${state.done} focus sessions done">${dots}</div>
      <div class="controls">
        <button class="icon-btn" id="reset" title="Reset phase" aria-label="Reset">↺</button>
        <button class="main-btn" id="toggle">${state.running ? "Pause" : left < total(state) ? "Resume" : "Start"}</button>
        <button class="icon-btn" id="skip" title="Skip phase" aria-label="Skip">⏭</button>
      </div>
      <div class="row-foot">
        <button class="link-btn" id="fold">Fold to pill</button>
        <button class="link-btn" id="times">${setup ? "Done" : "Times"}</button>
      </div>
      ${setup ? `
        <div class="setup">
          ${PHASES.map((p) => `<label>${FULL[p]}<span><input type="number" min="1" max="180" data-min="${p}" value="${state.mins[p]}"> min</span></label>`).join("")}
          <label>Long break after<span><input type="number" min="2" max="12" id="every" value="${state.every}"> ×</span></label>
          <label>Auto-start next<input type="checkbox" id="auto" ${state.auto ? "checked" : ""}></label>
        </div>
      ` : ""}
    </div>
  `;

  root.querySelectorAll("[data-phase]").forEach((btn) => {
    btn.onclick = () => {
      const p = btn.dataset.phase;
      save({ ...state, phase: p, running: false, endsAt: null, left: total(state, p) });
    };
  });
  document.getElementById("reset").onclick = () => save({ ...state, running: false, endsAt: null, left: total(state) });
  document.getElementById("toggle").onclick = toggle;
  document.getElementById("skip").onclick = () => save(advance(state, Date.now(), false));
  document.getElementById("fold").onclick = () => save({ ...state, folded: true });
  document.getElementById("times").onclick = () => {
    setup = !setup;
    resize();
    render();
  };
  if (setup) {
    root.querySelectorAll("[data-min]").forEach((inp) => {
      inp.onchange = () => {
        const p = inp.dataset.min;
        const m = Math.min(180, Math.max(1, Math.round(Number(inp.value)) || 1));
        const mins = { ...state.mins, [p]: m };
        const next = { ...state, mins };
        if (p === state.phase && !state.running && state.left === total(state)) next.left = m * MIN;
        save(next);
      };
    });
    document.getElementById("every").onchange = (e) => save({ ...state, every: Math.min(12, Math.max(2, Math.round(Number(e.target.value)) || 4)) });
    document.getElementById("auto").onchange = (e) => save({ ...state, auto: !!e.target.checked });
  }
}

function toggle() {
  const now = Date.now();
  if (state.running) save({ ...state, running: false, endsAt: null, left: remaining(state, now) });
  else save({ ...state, running: true, endsAt: now + (state.left > 0 ? state.left : total(state)) });
}

async function tick() {
  if (!state.running || state.endsAt == null) return;
  const now = Date.now();
  if (now >= state.endsAt && lastNotifiedEnd !== state.endsAt) {
    lastNotifiedEnd = state.endsAt;
    const before = state;
    const after = advance(before, now, true);
    await save(after);
    await etude.storage.appendEvent("phase.done", { phase: before.phase, mins: before.mins[before.phase], done: after.done });
    const title = before.phase === "focus" ? (after.phase === "long" ? `Focus done: ${after.done} in a row. Long break` : "Focus done. Take a break") : "Break's over";
    const description = after.running ? `${FULL[after.phase]} started: ${after.mins[after.phase]} min` : `${FULL[after.phase]} next: ${after.mins[after.phase]} min`;
    etude.notify({
      title,
      description,
      chime: true,
      actionLabel: after.running ? undefined : (after.phase === "focus" ? "Start focus" : "Start break"),
      actionId: after.running ? undefined : "start-next",
    });
    return;
  }
  render();
}

etude.onMessage((msg) => {
  if (msg?.type === "state" && msg.state) {
    state = { ...DEFAULT, ...msg.state, mins: { ...DEFAULT.mins, ...(msg.state.mins ?? {}) } };
    resize();
    render();
  }
});

(async () => {
  const saved = await etude.storage.get("state");
  if (saved && typeof saved === "object") state = { ...DEFAULT, ...saved, mins: { ...DEFAULT.mins, ...(saved.mins ?? {}) } };
  resize();
  render();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
