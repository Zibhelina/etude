<div class="sc-eyebrow">Balance the equation</div>
{{#prompt}}<div class="prose bl-prompt">{{md:prompt}}</div>{{/prompt}}
<div class="bl-eq" role="group" aria-label="Equation"></div>
<div class="bl-ledger" aria-live="polite"></div>
<p class="e-muted bl-hint only-answer">Tap the arrows or type a number.<span class="kb"> On a keyboard, <kbd>↑</kbd> <kbd>↓</kbd> change a coefficient and <kbd>←</kbd> <kbd>→</kbd> move between them.</span></p>
<template data-on="result">
  <div class="e-reveal">
    <div class="bl-answer"></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
    <p class="sc-how">The grader parsed every formula, parentheses included, and counted the atoms on each side with your coefficients, so any balanced answer is recognised and an unreduced one gets partial credit.</p>
  </div>
</template>
