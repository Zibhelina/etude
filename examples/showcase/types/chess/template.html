<div class="ch">
  <div class="ch-head">
    <div class="prose ch-prompt">{{md:prompt}}</div>
    <div class="ch-turn"></div>
  </div>
  <div class="ch-main">
    <div class="ch-board" aria-label="Chess board"></div>
    <template data-on="result">
      <div class="ch-info">
        <div class="ch-tag"></div>
        <div class="ch-san"></div>
        <p class="ch-yours" hidden></p>
        {{#explanation}}<div class="prose ch-expl">{{md:explanation}}</div>{{/explanation}}
      </div>
    </template>
  </div>
  <p class="ch-hint only-answer" aria-live="polite"></p>
</div>
