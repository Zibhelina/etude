<div class="sc-eyebrow">Mark the points</div>
<div class="prose">{{md:prompt}}</div>
<div class="pl-bar">
  <span class="pl-count" aria-live="polite"></span>
  <button type="button" class="e-btn pl-clear only-answer">Clear</button>
</div>
<div class="pl-stage">
  <svg class="pl-svg" role="application" tabindex="0" aria-label="Coordinate grid. Tap to place a point, tap a point to remove it. Arrow keys move the cursor, Enter places or removes a point.">
    <g class="pl-grid"></g>
    <g class="pl-curves"></g>
    <g class="pl-expected"></g>
    <g class="pl-placed"></g>
    <g class="pl-cursor"><circle r="0.12"></circle></g>
  </svg>
  <div class="pl-tags"></div>
</div>
<p class="e-muted pl-hint only-answer">Tap to place a point, drag to move it, tap it again to remove it. Points snap to the nearest {{snap}}. Keyboard: arrows move, <kbd>Enter</kbd> places.</p>
<template data-on="result">
  <div class="e-reveal">
    <div class="pl-score"></div>
    <div class="pl-legend"></div>
    <div class="pl-list prose"></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
    <p class="sc-how">Your points were matched to the expected ones by distance, so order doesn't matter and stray points cost credit. Every review draws a new curve, so you can't memorise the picture.</p>
  </div>
</template>
