<div class="sc-eyebrow">Read the note</div>
<div class="prose st-prompt">{{md:prompt}}</div>
<div class="st-staff"></div>
<div class="st-kb"></div>
<p class="e-muted st-help only-answer"></p>
<template data-on="result">
  <div class="e-reveal">
    <div class="st-answer"></div>
    <div><button type="button" class="play-btn small st-play"><span class="ic"></span><span>Hear it</span></button></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
    <p class="sc-how">The note was placed for this review, so every review is a new reading; the keyboard answer is checked by pitch, not by matching a stored picture.</p>
  </div>
</template>
