<div class="sc-eyebrow">Timeline</div>
<div class="prose tl-prompt">{{md:prompt}}</div>
<div class="tl-tray" aria-label="Events to place"></div>
<div class="tl-wrap"><div class="tl"></div></div>
<p class="e-muted tl-help only-answer">Drag each chip onto the line (tap one to drop it in the middle); drag it back up to take it off. On a keyboard: <kbd>Tab</kbd> to a chip, <kbd>←</kbd> <kbd>→</kbd> to move it (hold <kbd>Shift</kbd> for 10 years).</p>
<template data-on="result">
  <div class="e-reveal">
    <div class="tl-list"></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
    <p class="sc-how">This card drew a different handful of events for this review, and graded both the order you put them in and how many years each one was off.</p>
  </div>
</template>
