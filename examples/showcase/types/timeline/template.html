<div class="sc-eyebrow">Timeline</div>
<div class="prose tl-prompt">{{md:prompt}}</div>
<div class="tl-tray" aria-label="Events to place"><span class="tl-tray-empty">All placed. Drag one back here to take it off the line.</span></div>
<div class="tl-wrap"><div class="tl"></div></div>
<p class="e-muted tl-help only-answer">Drag each event onto the line, or tap it to drop it in the middle.<span class="kb"> On a keyboard, <kbd>Tab</kbd> to an event, <kbd>←</kbd> <kbd>→</kbd> move it a year, with <kbd>Shift</kbd> ten, and <kbd>Delete</kbd> takes it off.</span></p>
<template data-on="result">
  <div class="e-reveal">
    <div class="tl-list"></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
    <p class="sc-how">This card drew a different handful of events for this review, and graded both the order you put them in and how many years each one was off.</p>
  </div>
</template>
