<div class="wk">
  <div class="c3-eyebrow">Work it out</div>
  <div class="prose wk-prompt">{{md:prompt}}</div>
  <div class="wk-pad" hidden>
    <canvas class="wk-canvas"></canvas>
    <div class="wk-ph only-answer"></div>
    <div class="wk-tools only-answer" role="toolbar" aria-label="Scratchpad tools">
      <button type="button" class="wk-t is-on" data-tool="pen" title="Pen (P)" aria-label="Pen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button type="button" class="wk-t" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
      <button type="button" class="wk-t" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" class="wk-t" data-act="clear" title="Clear" aria-label="Clear"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
    </div>
  </div>
  <div class="wk-row only-answer">
    <label class="wk-ans"><span>Answer</span><input class="wk-input" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="{{placeholder}}" aria-label="Answer"></label>
    <button type="button" class="wk-toggle" aria-pressed="false" aria-label="Scratchpad" title="Show the scratchpad"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Scratchpad</span></button>
  </div>
  <div class="wk-note only-answer" aria-live="polite"></div>
  <button type="button" class="wk-stuck only-answer">I’m stuck, show me the solution</button>
  <template data-on="result">
    <div class="wk-yours"></div>
    {{#solution}}<div class="wk-sol"><div class="wk-lab">Solution</div><div class="prose wk-solution">{{md:solution}}</div></div>{{/solution}}
    <div class="wk-accept"><div class="wk-lab">Accepted</div><div class="wk-accepted"></div></div>
    {{#explanation}}<div class="prose wk-expl">{{md:explanation}}</div>{{/explanation}}
    <div class="wk-shot" hidden><div class="wk-lab">Your work</div></div>
  </template>
</div>
