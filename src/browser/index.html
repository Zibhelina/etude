<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <!-- The full policy, with a fresh nonce for card frames, comes from csp-boot.js, which the build puts first in <head>. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>εtude</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- External (web/public/theme-boot.js) so the page can run under script-src 'self'. -->
    <script src="%BASE_URL%theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app-main.ts"></script>
  </body>
</html>
