<div class="prose code-prompt">{{md:prompt}}</div>
<div class="e-editor code-box">
  <div class="e-editor-head"><span class="code-lang">{{language}}</span><span class="code-hint only-answer"><kbd>Tab</kbd> indents · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> runs</span></div>
  <div class="code-host"><pre class="e-editor-loading">{{starter}}</pre></div>
</div>
<template data-on="result">
  <div class="e-reveal code-res">
    <div class="code-verdict"></div>
    <div class="code-tests"></div>
    {{#explanation}}<div class="prose code-expl">{{md:explanation}}</div>{{/explanation}}
    <div class="code-tabs" role="tablist"><button type="button" role="tab" class="code-tab" data-tab="mine">Your code</button>{{#reference}}<button type="button" role="tab" class="code-tab" data-tab="ref">Reference</button>{{/reference}}</div>
    <div class="code-view"></div>
    {{#reference}}<pre class="code-ref" hidden><code></code></pre>{{/reference}}
  </div>
</template>
