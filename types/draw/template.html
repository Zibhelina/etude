<div class="prose">{{md:prompt}}</div>
<div class="pad">
  <div class="tools only-answer">
    <div class="group">
      <button type="button" class="e-btn tool is-on" data-tool="pen" title="Pen (P)">Pen</button>
      <button type="button" class="e-btn tool" data-tool="eraser" title="Eraser (E)">Eraser</button>
    </div>
    <div class="group">
      <button type="button" class="e-btn size" data-size="2" title="Thin">S</button>
      <button type="button" class="e-btn size is-on" data-size="3.5" title="Medium">M</button>
      <button type="button" class="e-btn size" data-size="7" title="Thick">L</button>
    </div>
    <div class="group swatches"></div>
    <div class="group end">
      <button type="button" class="e-btn icon" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button type="button" class="e-btn icon" data-act="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
      <button type="button" class="e-btn" data-act="clear">Clear</button>
    </div>
  </div>
  <canvas class="canvas"></canvas>
</div>
<template data-on="result">
  <div class="e-reveal">
    <div><div class="e-section-title">What a correct drawing shows</div><div class="prose e-answer">{{md:reference}}</div></div>
  </div>
</template>
