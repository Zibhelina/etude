<div class="prose">{{md:prompt}}</div>
<div class="pad">
  <div class="tools only-answer" role="toolbar" aria-label="Pen">
    <div class="group">
      <button type="button" class="e-btn tool is-on" data-tool="pen" title="Pen (P)" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button type="button" class="e-btn tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
    </div>
    <div class="group sizes">
      <button type="button" class="e-btn size" data-size="2" title="Thin" aria-label="Thin"><i style="--d:4px"></i></button>
      <button type="button" class="e-btn size is-on" data-size="3.5" title="Medium" aria-label="Medium"><i style="--d:7px"></i></button>
      <button type="button" class="e-btn size" data-size="7" title="Thick" aria-label="Thick"><i style="--d:11px"></i></button>
    </div>
    <div class="group swatches"></div>
    <div class="group end">
      <button type="button" class="e-btn icon" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" class="e-btn icon" data-act="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button type="button" class="e-btn icon" data-act="clear" title="Clear" aria-label="Clear"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
    </div>
  </div>
  <canvas class="canvas"></canvas>
  <div class="pad-hint only-answer">Draw with your mouse, finger or pen</div>
</div>
<template data-on="result">
  <div class="e-reveal dr-res">
    <div class="dr-pair">
      <figure class="dr-mine"><div class="dr-tile"></div><figcaption>Yours</figcaption></figure>
      <figure class="dr-ref"><div class="dr-tile prose">{{md:reference}}</div><figcaption>Reference</figcaption></figure>
    </div>
    <div class="prose dr-more"></div>
  </div>
</template>
