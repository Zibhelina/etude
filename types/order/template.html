<div class="prose">{{md:prompt}}</div>
<ol class="blocks" aria-label="Blocks to order"></ol>
<p class="e-muted help only-answer">Drag to reorder, or focus a block and use <kbd>Alt</kbd>+<kbd>↑</kbd> <kbd>↓</kbd>.</p>
<template data-on="result">
  <div class="e-reveal">
    <div><div class="e-section-title">Correct order</div><ol class="solution"></ol></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
  </div>
</template>
