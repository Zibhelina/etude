<div class="prose">{{md:prompt}}</div>
<input class="e-input" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="{{placeholder}}" autofocus>
<template data-on="result">
  <div class="e-reveal">
    <div><div class="e-section-title">Accepted</div><div class="accepted"></div></div>
    {{#explanation}}<div class="prose">{{md:explanation}}</div>{{/explanation}}
  </div>
</template>
