<div class="prose">{{md:prompt}}</div>
<div class="ex-field only-answer"><input class="e-input" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="{{placeholder}}" autofocus></div>
<template data-on="result">
  <div class="e-reveal ex-res">
    <div class="ex-yours"></div>
    <div class="ex-big accepted"></div>
    <div class="ex-also"></div>
    {{#explanation}}<div class="prose ex-expl">{{md:explanation}}</div>{{/explanation}}
  </div>
</template>
