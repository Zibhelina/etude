<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Chess</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { overflow-y: hidden; }
body { margin: 0; color: var(--text-primary); font: 16px/1.7 var(--sans); }
/* One content column for prose, board, and controls, so all three share a left
   and right edge instead of the board floating inside a wider text block. The
   column takes the full frame: the host sizes the widget, and capping it here
   left dead space beside the two-board reveal. */
.wrap { display: flex; flex-direction: column; padding: 22px 26px 14px; min-width: 0; }
.label { color: var(--text-muted); font: 500 13px/1.3 var(--sans); letter-spacing: .01em; }
h1.title { margin: 2px 0 0; font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.prompt { margin: 10px 0 0; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.prompt p { margin: 0 0 8px; } .prompt p:last-child { margin-bottom: 0; }

/* The board is the surface here — a card around it would nest one panel inside
   another, so the controls sit directly on the host canvas. */
.card { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.meta .spacer { flex: 1 1 auto; }
/* Side to move and phase are facts about the position, not buttons: filled
   pills made them compete with the board for attention. Text only, one weight. */
.meta .ui-badge { border: 0; background: none; padding: 0 4px; border-radius: 0;
  color: var(--text-muted); font-size: 12.5px; font-weight: 400; }
.meta .ui-badge + .ui-badge::before { content: '·'; margin-right: 8px;
  color: var(--border); }

/* The board is square and shrinks with the frame; 320px viewports still get a
   readable 8x8 grid because every square is sized from the same aspect box.
   Rows are declared explicitly: implicit rows size to content, so an empty rank
   collapses to a strip while its neighbours absorb the slack. */
/* The board aligns with the prose above it rather than sitting centred in a
   narrower band. The cap is a readable-line width so a wide frame widens the
   text and the board together instead of letting the board outrun it. */
.boardWrap { width: 100%; max-width: 520px; min-width: 0; }
/* After submitting, the learner's board and the engine's sit side by side so
   the two positions can be compared directly. They stack on narrow frames,
   where two 8x8 grids would each be too small to read. */
.compare { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
/* Split view: the two boards divide the frame evenly instead of each keeping
   the single-board cap, which left the pair floating in a narrow column. */
.compare[data-split="true"] .boardWrap { flex: 1 1 260px; max-width: none; }
.boardCaption { font: 500 12px/1.4 var(--sans); color: var(--text-secondary);
  margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.boardCaption .mark { font-size: 13px; }
.boardCaption[data-verdict="good"] { color: var(--status-good); }
.boardCaption[data-verdict="bad"] { color: var(--status-critical); }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  aspect-ratio: 1 / 1; width: 100%; container-type: inline-size;
  border: 0.5px solid var(--border); border-radius: calc(var(--radius) * .5); overflow: hidden; }
.sq { position: relative; padding: 0; margin: 0; border: 0; background: var(--square-light);
  min-width: 0; min-height: 0; cursor: pointer;
  display: grid; place-items: center; touch-action: none; -webkit-user-select: none; user-select: none;
  transition: background .12s ease; }
.sq[data-shade="dark"] { background: var(--square-dark); }
.sq:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; z-index: 2; }
/* Selection and reveal carry a shape (inset ring / corner marker), never color alone. */
.sq[data-state="from"], .sq[data-state="to"], .sq[data-state="selected"] {
  background: color-mix(in srgb, var(--primary) 26%, var(--square-light)); }
.sq[data-shade="dark"][data-state="from"], .sq[data-shade="dark"][data-state="to"],
.sq[data-shade="dark"][data-state="selected"] {
  background: color-mix(in srgb, var(--primary) 26%, var(--square-dark)); }
.sq[data-state]:not([data-state=""])::after { content: ""; position: absolute; inset: 2px;
  border: 2px solid var(--foreground); border-radius: 4px; pointer-events: none; }
.sq[data-state="to"]::after { border-style: dashed; }
/* Empty target squares get a dot; occupied ones get a ring, the way board UIs
   distinguish a quiet move from a capture. */
/* Move markers darken whichever square they sit on rather than using a single
   colour: a light-on-light dot vanished on the pale squares. --board-piece-edge
   is the board's own darkest ink, so it reads on both shades in every theme. */
.sq[data-target="true"]::before { content: ""; position: absolute; width: 30%; height: 30%;
  border-radius: 50%; background: color-mix(in srgb, var(--piece-edge) 42%, transparent);
  pointer-events: none; }
.sq[data-target="true"][data-occupied="true"]::before { width: 92%; height: 92%; background: none;
  border: 4px solid color-mix(in srgb, var(--piece-edge) 42%, transparent); box-sizing: border-box; }
.sq[data-drop="true"] { background: color-mix(in srgb, var(--ring) 40%, var(--square-light)); }
.sq[data-shade="dark"][data-drop="true"] { background: color-mix(in srgb, var(--ring) 40%, var(--square-dark)); }

/* Pieces are drawn as SVG, not font glyphs: the Unicode chess characters render
   as outlines for both sides in most system fonts, so White and Black become
   indistinguishable. Fills come from tokens so themes keep control. */
.glyph { pointer-events: none; display: block; width: 84%; height: 84%; }
.glyph svg { display: block; width: 100%; height: 100%; }
/* Stroke weights are in the 45-unit viewBox: at a ~40px square, 1.5 units is a
   ~1.3px outline. Anything heavier fills the piece in and both sides read as
   dark blobs regardless of their fill. */
.glyph .body { stroke: var(--piece-edge); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
/* The rook is all straight bands: rounded joins soften its corners into mush. */
.glyph[data-piece="r"] .body { stroke-linejoin: miter; }
.glyph[data-side="w"] .body { fill: var(--piece-white); }
.glyph[data-side="b"] .body { fill: var(--piece-black); }
.glyph .detail { fill: none; stroke: var(--piece-edge); stroke-width: 1.2; stroke-linecap: round; }
.glyph[data-side="b"] .detail { stroke: var(--piece-white); }
/* The king's cross sits on the square, not on the piece body, so it takes the
   outline colour on both sides. */
.glyph .cross { fill: none; stroke: var(--piece-edge); stroke-width: 1.8; stroke-linecap: round; }
/* Eye and mane on the knight: solid marks, so they invert by fill, not stroke. */
.glyph .dot { stroke: none; fill: var(--piece-edge); }
.glyph[data-side="b"] .dot { fill: var(--piece-white); }

.coord { position: absolute; font: 600 max(8px, 2.2cqw) / 1 var(--sans); pointer-events: none; opacity: .9; }
.coord.file { right: 4px; bottom: 2px; }
.coord.rank { left: 4px; top: 2px; }
/* Coordinates take the colour of the *opposite* shade, chess.com style, so they
   stay legible on both without a halo. */
.sq[data-shade="light"] .coord { color: var(--square-dark); }
.sq[data-shade="dark"] .coord { color: var(--square-light); }

.promo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.promo button { min-width: 44px; min-height: 44px; padding: 4px; }
.promo button .glyph { width: 30px; height: 30px; }
.status { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--text-secondary); min-height: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
/* Trimmed from the shared 2.5rem: these sit under a large board and read as
   oversized at full size. 32px still clears a comfortable pointer target. */
.actions .ui-button { min-height: 32px; padding: 4px 12px; font-size: 13.5px; }
.reveal { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 0.5px solid var(--border);
  border-radius: calc(var(--radius) * .75); background: var(--surface-1); font-size: 13.5px; }
.reveal .row { display: flex; gap: 8px; align-items: baseline; }
.reveal .k { color: var(--text-secondary); min-width: 108px; }
.reveal .v { font-family: var(--mono); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Board colours come from the theme (--board-*), like every other surface. They
   are their own tokens rather than mixes of --foreground/--primary because
   "light square", "dark square", "White", "Black" are semantics of the game:
   deriving them from the text colour inverted the board in dark themes and
   collapsed the two shades into one grey. The fallbacks keep the template
   readable if a theme predates these tokens. */
:root {
  --square-light: var(--board-light, var(--muted));
  --square-dark: var(--board-dark, var(--accent));
  --piece-white: var(--board-piece-white, var(--background));
  --piece-black: var(--board-piece-black, var(--foreground));
  --piece-edge: var(--board-piece-edge, var(--foreground));
}

@media (max-width: 400px) { .wrap { padding: 16px 14px 12px; } .card { padding: 12px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-fit-content>
<div class="wrap">
  <div class="label" id="phaseLabel"></div>
  <h1 class="title" id="topic">Chess</h1>
  <div class="prompt" id="prompt"></div>

  <section class="card" id="card">
    <div class="meta">
      <span class="ui-badge" id="turnBadge"></span>
      <span class="ui-badge" id="phaseBadge"></span>
      <span class="spacer"></span>
      <span class="ui-muted" id="moveText"></span>
    </div>

    <div class="compare" id="compare">
      <div class="boardWrap">
        <div class="boardCaption hidden" id="yourCaption"></div>
        <div class="board" id="board" role="grid" aria-label="Chess position"></div>
      </div>
      <div class="boardWrap hidden" id="engineWrap">
        <div class="boardCaption" id="engineCaption"></div>
        <div class="board" id="engineBoard" role="grid"></div>
      </div>
    </div>

    <div class="promo hidden" id="promotion" role="group">
      <span class="ui-muted" id="promoLabel"></span>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="actions">
      <button type="button" class="ui-button ui-button-secondary hidden" id="retry"></button>
      <button type="button" class="ui-button hidden" id="tryAgain"></button>
      <button type="button" class="ui-button ui-button-secondary hidden" id="again"></button>
    </div>

    <div class="reveal hidden" id="reveal"></div>
  </section>

  <div class="ui-card card hidden" id="configError">
    <div class="ui-card-title" id="configErrorTitle"></div>
    <div class="ui-card-description" id="configErrorBody"></div>
  </div>
</div>

<script>const ETUDE = /*__DATA__*/null;</script>
<script>
(() => {
  'use strict';
  const data = ETUDE || {};
  const atom = data.atom || {};
  const widgetData = atom.widget_data || {};
  const $ = id => document.getElementById(id);

  /* ---------------------------------------------------------------- i18n */
  function isPortuguese() {
    const text = `${atom.user_prompt || ''} ${atom.topic || ''}`;
    return /[áàãâéêíóôõúç]/i.test(text) || /\b(melhor|lance|brancas|pretas)\b/i.test(text);
  }
  const ui = isPortuguese() ? {
    retry: 'Reenviar tentativa', tryAgain: 'Tentar novamente', again: 'Ver posição inicial',
    whiteToMove: 'Brancas jogam', blackToMove: 'Pretas jogam',
    pick: 'Escolha a peça e a casa de destino.', picked: m => `Lance escolhido: ${m}.`,
    checking: 'Conferindo lance…',
    promote: 'Promover a:', yourMove: 'Seu lance', engineMove: 'Lance do Stockfish',
    correct: 'Correto — o lance confere com o Stockfish.',
    wrong: 'Incorreto — o Stockfish prefere outro lance.',
    replayChecked: 'Repetição conferida; a tentativa original foi mantida.',
    revealBoard: 'À esquerda, o seu lance; à direita, o do Stockfish.',
    sendFailed: 'Não foi possível registrar a tentativa. O lance foi mantido; tente reenviar.',
    sent: 'Tentativa registrada.', noExpected: 'Este item não traz o lance de referência.',
    orientation: s => `tabuleiro visto pelas ${s === 'w' ? 'brancas' : 'pretas'}`,
    errorTitle: 'Posição indisponível',
    errorBody: 'Este item precisa de um FEN válido em widget_data.fen.',
    illegal: 'Lance ilegal nesta posição.', phase: 'fase',
  } : {
    retry: 'Retry send', tryAgain: 'Try again', again: 'Show starting position',
    whiteToMove: 'White to move', blackToMove: 'Black to move',
    pick: 'Choose a piece, then its destination square.', picked: m => `Chosen move: ${m}.`,
    checking: 'Checking move…',
    promote: 'Promote to:', yourMove: 'Your move', engineMove: 'Stockfish move',
    correct: 'Correct — your move matches Stockfish.',
    wrong: 'Incorrect — Stockfish prefers a different move.',
    replayChecked: 'Replay checked; the original attempt was left unchanged.',
    revealBoard: 'Left: your move. Right: Stockfish’s.',
    sendFailed: 'The attempt could not be recorded. Your move was kept; try sending it again.',
    sent: 'Attempt recorded.', noExpected: 'This item carries no reference move.',
    orientation: s => `board seen from ${s === 'w' ? 'White' : 'Black'}`,
    errorTitle: 'Position unavailable',
    errorBody: 'This item needs a valid FEN in widget_data.fen.',
    illegal: 'That move is not legal in this position.', phase: 'phase',
  };

  /* ------------------------------------------------------------ chess core
     Indices run 0 = a8 through 63 = h1, matching FEN reading order. */
  const FILES = 'abcdefgh';
  /* Piece shapes, in a 45x45 box (the Cburnett geometry every board UI uses).
     `body` takes the side fill, `detail` the contrasting interior lines. */
  const SHAPE = {
    /* Pawn: ball head, then a neck that tapers straight out into the skirt.
       The neck must narrow monotonically — an intermediate collar that bulges
       back out wider than the neck reads as a second head stacked on the first. */
    p: '<path class="body" d="M22.5 9.5a5 5 0 0 0-3.02 8.98c-3.16 2.2-5.63 7.66-6.48 15.52h19a35.5 35.5 0 0 0-6.48-15.52A5 5 0 0 0 22.5 9.5z"/>'
      + '<path class="body" d="M11.5 38.5c.6-2.4 1.3-4.5 2-4.5h18c.7 0 1.4 2.1 2 4.5z"/>',
    /* Rook: stacked band paths rather than one outline plus overlaid rules —
       each band's own edge draws the line, so nothing can sit off-register. */
    r: '<path class="body" d="M9 39h27v-3H9z"/>'
      + '<path class="body" d="M12.5 32l1.5-2.5h17l1.5 2.5z"/>'
      + '<path class="body" d="M12 36v-4h21v4z"/>'
      + '<path class="body" d="M14 29.5v-13h17v13z"/>'
      + '<path class="body" d="M14 16.5L11 14h23l-3 2.5z"/>'
      /* Crenellations span the shaft exactly (x=11→34): three merlons of 4.5
         separated by two 4.75 notches. The earlier run ended short at x=30,
         which left the right side of the crown open. */
      + '<path class="body" d="M11 14V9h4.5v2h4.75v-2h4.5v2h4.75v-2h4.5v5z"/>',
    /* Knight: the Cburnett geometry (the standard open-licence chess set). Two
       body paths — head+neck, then the muzzle/mane wedge — plus an eye and a
       mane slit as solid marks. Hand-drawing this shape does not converge;
       the reference outline is what makes it read as a horse at 40px. */
    n: '<path class="body" d="M22 10c10.5.5 16.5 8 16 29H15c0-9 10-6.5 8-21"/>'
      + '<path class="body" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>'
      + '<path class="dot" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0z"/>'
      + '<path class="dot" d="M14.933 15.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5z"/>',
    b: '<path class="body" d="M9 36c3.4-1 10.1.4 13.5-2 3.4 2.4 10.1 1 13.5 2 0 0 1.7.5 3-2-.7-1-1.6-1-3-1.5-3.4-1-10.1.5-13.5-1-3.4 1.5-10.1 0-13.5 1-1.4.5-2.3.5-3 1.5 1.3 2.5 3 2 3 2z"/>'
      + '<path class="body" d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>'
      + '<path class="body" d="M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>'
      + '<path class="detail" d="M17.5 26h10M15 30h15M22.5 15.5v5M20 18h5"/>',
    q: '<path class="body" d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/>'
      + '<path class="body" d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/>'
      + '<path class="detail" d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/>'
      + '<g class="body"><circle cx="6" cy="12" r="2.5"/><circle cx="14" cy="9" r="2.5"/>'
      + '<circle cx="22.5" cy="8" r="2.5"/><circle cx="31" cy="9" r="2.5"/><circle cx="39" cy="12" r="2.5"/></g>',
    k: '<path class="cross" d="M22.5 11.6V6M20 8h5"/>'
      + '<path class="body" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>'
      + '<path class="body" d="M12.5 37c5.5 3.5 14.5 3.5 20 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4v3.5-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z"/>'
      + '<path class="detail" d="M12.5 30c5.5-3 14.5-3 20 0m-20 3.5c5.5-3 14.5-3 20 0m-20 3.5c5.5-3 14.5-3 20 0"/>',
  };
  const PIECE_SVG = piece => {
    const kind = piece.toLowerCase();
    return `<svg viewBox="0 0 45 45" aria-hidden="true" focusable="false">${SHAPE[kind] || ''}</svg>`;
  };
  const NAME = {k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn'};
  const NAME_PT = {k: 'rei', q: 'dama', r: 'torre', b: 'bispo', n: 'cavalo', p: 'peão'};

  const fileOf = index => index % 8;
  const rankOf = index => 7 - Math.floor(index / 8);
  const squareName = index => `${FILES[fileOf(index)]}${rankOf(index) + 1}`;
  const squareIndex = name => {
    const file = FILES.indexOf(name[0]);
    const rank = Number(name[1]) - 1;
    if (file < 0 || !(rank >= 0 && rank <= 7)) return -1;
    return (7 - rank) * 8 + file;
  };
  const isWhite = piece => piece && piece === piece.toUpperCase();
  const sideOf = piece => (piece ? (isWhite(piece) ? 'w' : 'b') : '');

  function parseFen(fen) {
    if (typeof fen !== 'string') return null;
    const parts = fen.trim().split(/\s+/);
    if (parts.length < 4) return null;
    const rows = parts[0].split('/');
    if (rows.length !== 8) return null;
    const board = new Array(64).fill('');
    let index = 0;
    for (const row of rows) {
      let file = 0;
      for (const character of row) {
        if (/[1-8]/.test(character)) { file += Number(character); index += Number(character); continue; }
        if (!'kqrbnpKQRBNP'.includes(character)) return null;
        board[index] = character; index += 1; file += 1;
      }
      if (file !== 8) return null;
    }
    if (parts[1] !== 'w' && parts[1] !== 'b') return null;
    return {
      board,
      turn: parts[1],
      castling: parts[2] === '-' ? '' : parts[2],
      ep: parts[3] === '-' ? -1 : squareIndex(parts[3]),
      halfmove: Number(parts[4] || 0),
      fullmove: Number(parts[5] || 1),
    };
  }

  function slide(state, from, steps, moves) {
    const side = sideOf(state.board[from]);
    for (const [df, dr] of steps) {
      let file = fileOf(from) + df;
      let rank = rankOf(from) + dr;
      while (file >= 0 && file < 8 && rank >= 0 && rank < 8) {
        const to = (7 - rank) * 8 + file;
        const target = state.board[to];
        if (!target) moves.push({from, to});
        else { if (sideOf(target) !== side) moves.push({from, to}); break; }
        file += df; rank += dr;
      }
    }
  }

  function step(state, from, steps, moves) {
    const side = sideOf(state.board[from]);
    for (const [df, dr] of steps) {
      const file = fileOf(from) + df;
      const rank = rankOf(from) + dr;
      if (file < 0 || file > 7 || rank < 0 || rank > 7) continue;
      const to = (7 - rank) * 8 + file;
      if (sideOf(state.board[to]) !== side) moves.push({from, to});
    }
  }

  const DIAGONALS = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const LINES = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const KNIGHT = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];

  function pseudoMoves(state, side, includeCastling) {
    const moves = [];
    for (let from = 0; from < 64; from += 1) {
      const piece = state.board[from];
      if (!piece || sideOf(piece) !== side) continue;
      const kind = piece.toLowerCase();
      if (kind === 'p') {
        const direction = side === 'w' ? 1 : -1;
        const rank = rankOf(from);
        const file = fileOf(from);
        const ahead = (7 - (rank + direction)) * 8 + file;
        if (rank + direction >= 0 && rank + direction <= 7 && !state.board[ahead]) {
          pushPawn(moves, from, ahead, side);
          const startRank = side === 'w' ? 1 : 6;
          const twoAhead = (7 - (rank + 2 * direction)) * 8 + file;
          if (rank === startRank && !state.board[twoAhead]) moves.push({from, to: twoAhead});
        }
        for (const df of [-1, 1]) {
          const captureFile = file + df;
          const captureRank = rank + direction;
          if (captureFile < 0 || captureFile > 7 || captureRank < 0 || captureRank > 7) continue;
          const to = (7 - captureRank) * 8 + captureFile;
          const target = state.board[to];
          if (target && sideOf(target) !== side) pushPawn(moves, from, to, side);
          else if (to === state.ep) moves.push({from, to, enPassant: true});
        }
      } else if (kind === 'n') step(state, from, KNIGHT, moves);
      else if (kind === 'b') slide(state, from, DIAGONALS, moves);
      else if (kind === 'r') slide(state, from, LINES, moves);
      else if (kind === 'q') slide(state, from, DIAGONALS.concat(LINES), moves);
      else if (kind === 'k') {
        step(state, from, DIAGONALS.concat(LINES), moves);
        if (includeCastling) castlingMoves(state, side, from, moves);
      }
    }
    return moves;
  }

  function pushPawn(moves, from, to, side) {
    const lastRank = side === 'w' ? 7 : 0;
    if (rankOf(to) === lastRank) {
      for (const promotion of ['q', 'r', 'b', 'n']) moves.push({from, to, promotion});
    } else moves.push({from, to});
  }

  function castlingMoves(state, side, from, moves) {
    const rights = state.castling || '';
    const homeSquare = side === 'w' ? squareIndex('e1') : squareIndex('e8');
    if (from !== homeSquare) return;
    if (attacked(state, from, side === 'w' ? 'b' : 'w')) return;
    const plans = side === 'w'
      ? [{right: 'K', empty: ['f1', 'g1'], pass: 'f1', king: 'g1'},
         {right: 'Q', empty: ['d1', 'c1', 'b1'], pass: 'd1', king: 'c1'}]
      : [{right: 'k', empty: ['f8', 'g8'], pass: 'f8', king: 'g8'},
         {right: 'q', empty: ['d8', 'c8', 'b8'], pass: 'd8', king: 'c8'}];
    for (const plan of plans) {
      if (!rights.includes(plan.right)) continue;
      if (plan.empty.some(name => state.board[squareIndex(name)])) continue;
      if (attacked(state, squareIndex(plan.pass), side === 'w' ? 'b' : 'w')) continue;
      moves.push({from, to: squareIndex(plan.king), castle: plan.right});
    }
  }

  function attacked(state, square, bySide) {
    for (const move of pseudoMoves(state, bySide, false)) {
      if (move.to === square) return true;
    }
    return false;
  }

  function applyMove(state, move) {
    const board = state.board.slice();
    const piece = board[move.from];
    const side = sideOf(piece);
    const kind = piece.toLowerCase();
    board[move.from] = '';
    board[move.to] = move.promotion
      ? (side === 'w' ? move.promotion.toUpperCase() : move.promotion)
      : piece;
    if (kind === 'p' && move.to === state.ep && !state.board[move.to]) {
      // En passant: the captured pawn stands beside the arriving pawn, not on it.
      const capturedRank = side === 'w' ? rankOf(move.to) - 1 : rankOf(move.to) + 1;
      board[(7 - capturedRank) * 8 + fileOf(move.to)] = '';
    }
    if (kind === 'k' && Math.abs(fileOf(move.to) - fileOf(move.from)) === 2) {
      const rank = rankOf(move.from);
      const kingSide = fileOf(move.to) === 6;
      const rookFrom = (7 - rank) * 8 + (kingSide ? 7 : 0);
      const rookTo = (7 - rank) * 8 + (kingSide ? 5 : 3);
      board[rookTo] = board[rookFrom];
      board[rookFrom] = '';
    }
    let castling = state.castling;
    const drop = set => { for (const right of set) castling = castling.split(right).join(''); };
    if (kind === 'k') drop(side === 'w' ? 'KQ' : 'kq');
    if (move.from === squareIndex('a1') || move.to === squareIndex('a1')) drop('Q');
    if (move.from === squareIndex('h1') || move.to === squareIndex('h1')) drop('K');
    if (move.from === squareIndex('a8') || move.to === squareIndex('a8')) drop('q');
    if (move.from === squareIndex('h8') || move.to === squareIndex('h8')) drop('k');
    let ep = -1;
    if (kind === 'p' && Math.abs(rankOf(move.to) - rankOf(move.from)) === 2) {
      const middleRank = (rankOf(move.to) + rankOf(move.from)) / 2;
      ep = (7 - middleRank) * 8 + fileOf(move.from);
    }
    return {
      board,
      turn: side === 'w' ? 'b' : 'w',
      castling,
      ep,
      halfmove: kind === 'p' || state.board[move.to] ? 0 : state.halfmove + 1,
      fullmove: side === 'b' ? state.fullmove + 1 : state.fullmove,
    };
  }

  function legalMoves(state) {
    const side = state.turn;
    const legal = [];
    for (const move of pseudoMoves(state, side, true)) {
      const next = applyMove(state, move);
      const kingSquare = next.board.indexOf(side === 'w' ? 'K' : 'k');
      if (kingSquare < 0 || !attacked({...next, turn: side}, kingSquare, side === 'w' ? 'b' : 'w')) {
        legal.push(move);
      }
    }
    return legal;
  }

  const uciOf = move => `${squareName(move.from)}${squareName(move.to)}${move.promotion || ''}`.toLowerCase();

  function moveFromUci(state, uci) {
    if (typeof uci !== 'string' || uci.length < 4) return null;
    const text = uci.trim().toLowerCase();
    return legalMoves(state).find(move => uciOf(move) === text) || null;
  }

  /* --------------------------------------------------------------- render */
  const start = parseFen(widgetData.fen);
  if (!start) {
    $('card').classList.add('hidden');
    $('configError').classList.remove('hidden');
    $('configErrorTitle').textContent = ui.errorTitle;
    $('configErrorBody').textContent = ui.errorBody;
    return;
  }

  const orientation = start.turn;
  const squares = [];
  const engineSquares = [];
  let view = start;
  let selected = -1;
  let chosen = null;
  let pending = null;
  let sent = false;
  let submitting = false;
  let replaying = false;
  let revealed = false;
  let unsent = null;
  let submitted = null;
  const legal = legalMoves(start);

  function pieceLabel(piece) {
    if (!piece) return '';
    const kind = piece.toLowerCase();
    const names = isPortuguese() ? NAME_PT : NAME;
    const side = isWhite(piece)
      ? (isPortuguese() ? 'branco' : 'white')
      : (isPortuguese() ? 'preto' : 'black');
    return `${side} ${names[kind]}`;
  }

  /* `cells` collects the squares of whichever grid is being built, so the same
     code serves the interactive board and the read-only engine board. */
  function buildBoard(gridId, cells, interactive) {
    const order = [];
    for (let index = 0; index < 64; index += 1) order.push(orientation === 'w' ? index : 63 - index);
    const grid = $(gridId);
    grid.replaceChildren();
    for (const index of order) {
      const button = document.createElement(interactive ? 'button' : 'div');
      if (interactive) button.type = 'button';
      button.className = 'sq';
      button.dataset.index = String(index);
      button.dataset.shade = (fileOf(index) + rankOf(index)) % 2 === 0 ? 'dark' : 'light';
      button.dataset.state = '';
      button.setAttribute('role', 'gridcell');
      if (interactive) button.tabIndex = -1;
      const glyph = document.createElement('span');
      glyph.className = 'glyph';
      button.append(glyph);
      if (rankOf(index) === (orientation === 'w' ? 0 : 7)) {
        const file = document.createElement('span');
        file.className = 'coord file';
        file.textContent = FILES[fileOf(index)];
        button.append(file);
      }
      if (fileOf(index) === (orientation === 'w' ? 0 : 7)) {
        const rank = document.createElement('span');
        rank.className = 'coord rank';
        rank.textContent = String(rankOf(index) + 1);
        button.append(rank);
      }
      cells[index] = button;
      grid.append(button);
    }
    if (interactive) {
      const first = cells.find(Boolean);
      if (first) first.tabIndex = 0;
    }
  }

  /* Paints `state` into `cells`. The engine board passes its own cells and is
     never interactive, so selection and target dots apply to the main board. */
  function paintCells(cells, state, marks, interactive) {
    for (let index = 0; index < 64; index += 1) {
      const button = cells[index];
      if (!button) continue;
      const piece = state.board[index];
      const glyph = button.querySelector('.glyph');
      glyph.innerHTML = piece ? PIECE_SVG(piece) : '';
      glyph.dataset.side = sideOf(piece);
      glyph.dataset.piece = piece ? piece.toLowerCase() : '';
      button.dataset.state = marks && marks[index] ? marks[index] : '';
      button.dataset.target = 'false';
      button.dataset.occupied = piece ? 'true' : 'false';
      const label = piece ? `${squareName(index)}, ${pieceLabel(piece)}` : squareName(index);
      button.setAttribute('aria-label', label);
      if (interactive) button.disabled = revealed || submitting || Boolean(unsent);
    }
    if (!interactive) return;
    if (!revealed && selected >= 0) {
      cells[selected].dataset.state = 'selected';
      for (const move of legal) {
        if (move.from === selected && cells[move.to]) cells[move.to].dataset.target = 'true';
      }
    }
    if (!revealed && chosen) {
      cells[chosen.from].dataset.state = 'from';
      cells[chosen.to].dataset.state = 'to';
    }
  }

  function paint(state, marks) {
    // `revealed` still gates interactivity here, via paintCells.
    paintCells(squares, state, marks, true);
  }

  function refreshMeta() {
    $('turnBadge').textContent = start.turn === 'w' ? ui.whiteToMove : ui.blackToMove;
    const phase = typeof widgetData.phase === 'string' && widgetData.phase
      ? widgetData.phase
      : (atom.tags || []).find(tag => ['opening', 'middlegame', 'endgame'].includes(tag)) || '';
    $('phaseBadge').textContent = phase;
    $('phaseBadge').classList.toggle('hidden', !phase);
    $('phaseLabel').textContent = `${data.queue_label || data.queue || 'Etude'} · ${ui.orientation(orientation)}`;
    $('moveText').textContent = chosen ? uciOf(chosen) : '';
  }

  function selectSquare(index) {
    if (revealed || submitting || unsent) return;
    if (selected >= 0) {
      const candidates = legal.filter(move => move.from === selected && move.to === index);
      if (candidates.length > 1) { askPromotion(candidates); return; }
      if (candidates.length === 1) { commit(candidates[0]); return; }
    }
    // Selection always reads the starting position: `view` may already show a
    // chosen move, and picking a piece off that board would offer moves that
    // are not legal from the actual puzzle position.
    const piece = start.board[index];
    if (piece && sideOf(piece) === start.turn) {
      selected = index;
      if (chosen) { chosen = null; view = start; }
      $('status').textContent = ui.pick;
    } else if (selected >= 0 && legal.some(move => move.from === selected)) {
      $('status').textContent = ui.illegal;
      selected = -1;
    } else selected = -1;
    paint(view, null);
    refreshMeta();
  }

  async function commit(move) {
    if (revealed || submitting || unsent) return;
    chosen = move;
    selected = -1;
    pending = null;
    $('promotion').classList.add('hidden');
    $('status').textContent = ui.picked(uciOf(move));
    // Show the position the move produces, not the position before it: marking
    // the destination with an outline alone left the piece sitting on its old
    // square, so the chosen move was invisible.
    view = applyMove(start, move);
    submitting = true;
    paint(view, null);
    refreshMeta();
    $('status').textContent = ui.checking;
    await submitMove(move);
  }

  function askPromotion(candidates) {
    pending = candidates;
    const box = $('promotion');
    box.replaceChildren();
    const label = document.createElement('span');
    label.className = 'ui-muted';
    label.textContent = ui.promote;
    box.append(label);
    for (const candidate of candidates) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ui-button ui-button-outline';
      const piece = start.turn === 'w' ? candidate.promotion.toUpperCase() : candidate.promotion;
      const glyph = document.createElement('span');
      glyph.className = 'glyph';
      glyph.dataset.side = sideOf(piece);
      glyph.dataset.piece = piece.toLowerCase();
      glyph.innerHTML = PIECE_SVG(piece);
      button.append(glyph);
      button.setAttribute('aria-label', pieceLabel(piece));
      button.dataset.promotion = candidate.promotion;
      button.addEventListener('click', () => commit(candidate));
      box.append(button);
    }
    box.classList.remove('hidden');
  }

  /* ------------------------------------------------------- interactions */
  function indexFromEvent(event) {
    const target = event.target instanceof Element ? event.target.closest('.sq') : null;
    return target ? Number(target.dataset.index) : -1;
  }

  $('board').addEventListener('click', event => {
    const index = indexFromEvent(event);
    if (index >= 0) selectSquare(index);
  });

  // Drag and drop mirrors the click path: pointerdown on a piece of the side to
  // move, pointerup on the destination. Keyboard users get the same two steps.
  let dragFrom = -1;
  $('board').addEventListener('pointerdown', event => {
    if (revealed || submitting || unsent) return;
    const index = indexFromEvent(event);
    if (index < 0) return;
    const piece = view.board[index];
    if (piece && sideOf(piece) === start.turn) dragFrom = index;
  });
  $('board').addEventListener('pointermove', event => {
    if (dragFrom < 0) return;
    const index = indexFromEvent(event);
    for (const square of squares) if (square) square.dataset.drop = 'false';
    if (index >= 0 && index !== dragFrom && squares[index]) squares[index].dataset.drop = 'true';
  });
  $('board').addEventListener('pointerup', event => {
    if (dragFrom < 0) return;
    const index = indexFromEvent(event);
    for (const square of squares) if (square) square.dataset.drop = 'false';
    if (index >= 0 && index !== dragFrom) {
      selected = dragFrom;
      selectSquare(index);
    }
    dragFrom = -1;
  });
  $('board').addEventListener('pointercancel', () => {
    dragFrom = -1;
    for (const square of squares) if (square) square.dataset.drop = 'false';
  });

  $('board').addEventListener('keydown', event => {
    const index = indexFromEvent(event);
    if (index < 0) return;
    const deltas = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1]};
    const delta = deltas[event.key];
    if (!delta) return;
    event.preventDefault();
    const sign = orientation === 'w' ? 1 : -1;
    const file = fileOf(index) + delta[0] * sign;
    const rank = rankOf(index) + delta[1] * sign;
    if (file < 0 || file > 7 || rank < 0 || rank > 7) return;
    const next = (7 - rank) * 8 + file;
    for (const square of squares) if (square) square.tabIndex = -1;
    squares[next].tabIndex = 0;
    squares[next].focus();
  });

  /* ------------------------------------------------------ submit + reveal */
  const expected = typeof data.expected === 'string'
    ? data.expected
    : (Array.isArray(data.expected) ? String(data.expected[0] || '') : '');

  function attemptBody(uci) {
    const body = {atom_id: atom.id, answer: uci, via: 'widget', mode: 'widget'};
    if (data.queue) body.queue = data.queue;
    return body;
  }

  async function postAttempt(body) {
    if (!data.api) { unsent = body; return false; }
    try {
      const response = await fetch(`${String(data.api).replace(/\/$/, '')}/api/attempts`, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      unsent = null;
      return true;
    } catch (_) {
      unsent = body;
      return false;
    }
  }

  function reveal(uci) {
    revealed = true;
    const engineMove = moveFromUci(start, expected);
    const matched = expected && uci === expected.trim().toLowerCase();

    // Left board keeps the learner's move; the right one shows the engine's, so
    // the two positions can be compared instead of one replacing the other.
    const yourMove = chosen || moveFromUci(start, uci);
    submitted = yourMove;
    const yourMarks = [];
    if (yourMove) {
      view = applyMove(start, yourMove);
      yourMarks[yourMove.from] = 'from';
      yourMarks[yourMove.to] = 'to';
    }
    paint(view, yourMarks);
    const yourCaption = $('yourCaption');
    yourCaption.textContent = `${matched ? '✓' : '✗'} ${ui.yourMove} — ${uci}`;
    yourCaption.dataset.verdict = matched ? 'good' : 'bad';
    yourCaption.classList.remove('hidden');

    if (engineMove && !matched) {
      buildBoard('engineBoard', engineSquares, false);
      const engineMarks = [];
      engineMarks[engineMove.from] = 'from';
      engineMarks[engineMove.to] = 'to';
      paintCells(engineSquares, applyMove(start, engineMove), engineMarks, false);
      $('engineCaption').textContent = `${ui.engineMove} — ${expected.trim().toLowerCase()}`;
      $('engineWrap').classList.remove('hidden');
      $('compare').dataset.split = 'true';
    }

    const box = $('reveal');
    box.replaceChildren();
    const verdict = document.createElement('div');
    verdict.className = 'row';
    verdict.textContent = `${matched ? '✓' : '✗'} ${matched ? ui.correct : ui.wrong}`;
    box.append(verdict);
    // The captions above each board already carry both moves; repeat only what
    // the boards cannot show — a missing reference, or a match with no contrast
    // board to compare against.
    if (!expected) {
      const row = document.createElement('div');
      row.className = 'row ui-muted';
      row.textContent = ui.noExpected;
      box.append(row);
    } else if (matched) {
      const row = document.createElement('div');
      row.className = 'row';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = ui.engineMove;
      const v = document.createElement('span'); v.className = 'v';
      v.textContent = expected.trim().toLowerCase();
      row.append(k, v);
      box.append(row);
    } else if (engineMove) {
      const note = document.createElement('div');
      note.className = 'row ui-muted';
      note.textContent = ui.revealBoard;
      box.append(note);
    }
    box.classList.remove('hidden');
    $('tryAgain').classList.remove('hidden');
    $('again').classList.remove('hidden');
  }

  async function submitMove(move) {
    if (!move || sent) return;
    const uci = uciOf(move);
    if (replaying) {
      sent = true;
      submitting = false;
      $('status').textContent = ui.replayChecked;
      reveal(uci);
      return;
    }
    const ok = await postAttempt(attemptBody(uci));
    if (!ok) {
      // The learner's move survives a failed POST; only the send is retried.
      submitting = false;
      $('status').textContent = ui.sendFailed;
      $('retry').classList.remove('hidden');
      paint(view, null);
      return;
    }
    sent = true;
    submitting = false;
    $('retry').classList.add('hidden');
    $('status').textContent = ui.sent;
    reveal(uci);
  }

  $('retry').addEventListener('click', async () => {
    if (!unsent) return;
    const body = unsent;
    $('retry').disabled = true;
    const ok = await postAttempt(body);
    $('retry').disabled = false;
    if (!ok) { $('status').textContent = ui.sendFailed; return; }
    sent = true;
    submitting = false;
    $('retry').classList.add('hidden');
    $('status').textContent = ui.sent;
    reveal(String(body.answer));
  });

  function restartPuzzle() {
    sent = false;
    submitting = false;
    replaying = true;
    revealed = false;
    unsent = null;
    submitted = null;
    chosen = null;
    selected = -1;
    pending = null;
    view = start;
    dragFrom = -1;
    $('promotion').classList.add('hidden');
    $('yourCaption').classList.add('hidden');
    $('engineWrap').classList.add('hidden');
    $('compare').dataset.split = 'false';
    $('reveal').classList.add('hidden');
    $('retry').classList.add('hidden');
    $('tryAgain').classList.add('hidden');
    $('again').classList.add('hidden');
    $('status').textContent = ui.pick;
    paint(view, null);
    refreshMeta();
  }

  $('tryAgain').addEventListener('click', restartPuzzle);

  // Toggles the learner's board between the starting position and their move,
  // so the position before the move can be re-read. The engine board beside it
  // is the reference and stays put.
  $('again').addEventListener('click', () => {
    const move = submitted;
    if (!move) return;
    const showingStart = view === start;
    view = showingStart ? applyMove(start, move) : start;
    const marks = [];
    if (!showingStart) { /* back to the start: no move to highlight */ }
    else { marks[move.from] = 'from'; marks[move.to] = 'to'; }
    paint(view, showingStart ? marks : null);
  });

  $('retry').textContent = ui.retry;
  $('tryAgain').textContent = ui.tryAgain;
  $('again').textContent = ui.again;
  $('topic').textContent = atom.topic || 'Chess';
  if (typeof window.ETUDE_MD_INTO === 'function') window.ETUDE_MD_INTO($('prompt'), atom.user_prompt || '');
  else $('prompt').textContent = atom.user_prompt || '';
  $('status').textContent = ui.pick;
  buildBoard('board', squares, true);
  paint(view, null);
  refreshMeta();

  window.etudeChess = {parseFen, applyMove, legalMoves, moveFromUci, uciOf, squareName, squareIndex};
})();
</script>
</body>
</html>
