<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Flashcard drill</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 0; }
html, body { overflow-y: hidden; }
body {
  margin: 0;
  padding: clamp(16px, 3vw, 24px);
  color: var(--text-primary);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  font-feature-settings: "cv01", "ss03";
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.shell { width: min(760px, 100%); margin: 0 auto; }
.session-bar {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 18px;
  margin-bottom: 14px;
  padding: 0 2px;
}
.brand-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand {
  color: var(--accent-text);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -.01em;
}
.brand-mark {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--accent);
}
.queue {
  min-width: 0;
  overflow: hidden;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 400;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.counter {
  padding: 5px 9px;
  color: var(--text-secondary);
  background: var(--surface-1);
  border: 0.5px solid var(--border);
  border-radius: 999px;
  font: 500 11px/1 var(--mono);
  font-variant-numeric: tabular-nums;
}
.track {
  height: 2px;
  margin: 0 2px 18px;
  overflow: hidden;
  background: var(--surface-2);
  border-radius: 999px;
}
.fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: inherit;
  transition: width .28s ease;
}
.card {
  position: relative;
}
.answer-card {
  position: relative;
  overflow: hidden;
  width: min(650px, 100%);
  margin: clamp(30px, 6vw, 46px) auto 0;
  padding: clamp(22px, 4vw, 32px);
}
.answer-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: var(--surface-2);
  pointer-events: none;
}
.question-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: clamp(26px, 5vw, 38px);
}
.topic {
  width: fit-content;
  max-width: 100%;
  overflow: hidden;
  padding: 6px 9px;
  color: var(--violet-text);
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-control);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .07em;
  line-height: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.prompt {
  max-width: 650px;
  margin: 0 auto;
  color: var(--text-primary);
  text-align: center;
  font-size: clamp(25px, 4.4vw, 36px);
  font-weight: 500;
  letter-spacing: -.035em;
  line-height: 1.22;
  overflow-wrap: anywhere;
}
.prompt strong { font-weight: 500; }
.prompt p { margin: 0 0 0.6em; }
.prompt p:last-child { margin-bottom: 0; }
.prompt code, .answer code {
  display: inline;
  padding: .06em .24em;
  color: var(--text-primary);
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: .76em;
  font-weight: 500;
  letter-spacing: -.02em;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.controls {
  display: grid;
  gap: 12px;
  width: min(610px, 100%);
  margin: 0 auto;
}
.answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
input {
  width: 100%;
  min-width: 0;
  height: 50px;
  padding: 0 16px;
  color: var(--text-primary);
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-control);
  transition: border-color .15s ease, background .15s ease;
}
input::placeholder { color: var(--text-muted); }
input:hover { border-color: var(--text-secondary); }
input:focus {
  border-color: var(--accent);
  background: var(--surface-1);
}
button {
  min-height: 48px;
  padding: 0 18px;
  color: var(--text-primary);
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-control);
  cursor: pointer;
  font-weight: 500;
  transition: transform .12s ease, border-color .12s ease, background .12s ease, color .12s ease;
}
button:hover:not(:disabled) { border-color: var(--text-secondary); background: var(--surface-1); transform: translateY(-1px); }
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { cursor: wait; opacity: .68; }
.primary { color: var(--on-accent); background: var(--accent-strong); border-color: var(--accent-strong); }
.primary:hover:not(:disabled) { color: var(--surface-0); background: var(--text-primary); border-color: var(--text-primary); }
.secondary {
  min-height: 38px;
  justify-self: center;
  padding: 0 13px;
  color: var(--text-secondary);
  background: var(--surface-2);
  border-color: var(--border);
  font-size: 13px;
  font-weight: 500;
}
.secondary:hover:not(:disabled) { color: var(--text-primary); background: var(--surface-1); border-color: var(--text-secondary); }
.binary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.binary-choice {
  min-height: 64px;
  background: var(--surface-2);
  font-size: 16px;
  letter-spacing: -.01em;
}
.binary-choice:hover:not(:disabled) { color: var(--accent-text); border-color: var(--accent); }
.choice-key {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-right: 9px;
  color: var(--text-muted);
  background: var(--surface-1);
  border: 0.5px solid var(--border);
  border-radius: 5px;
  font: 500 10px/1 var(--mono);
}
.feedback {
  padding: 16px 18px;
  color: var(--text-secondary);
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-card);
  line-height: 1.5;
}
.feedback.right { border-color: var(--green); }
.feedback.wrong { border-color: var(--red); }
.feedback strong { color: var(--text-primary); font-weight: 500; }
.feedback .label { color: var(--text-secondary); font-size: 13px; }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wrong-button { border-color: var(--red); }
.right-button { border-color: var(--green); }
.hint {
  min-height: 17px;
  margin: 18px 0 0;
  color: var(--text-muted);
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
}
kbd {
  display: inline-block;
  min-width: 21px;
  margin: 0 2px;
  padding: 2px 5px;
  color: var(--text-secondary);
  background: var(--surface-1);
  border: 0.5px solid var(--border);
  border-radius: 5px;
  font: 500 10px/1.2 var(--mono);
}
.end {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 0;
  padding: clamp(30px, 5vw, 38px);
  text-align: center;
}
.completion-label { margin: 0 0 12px; color: var(--accent-text); font-size: 12px; font-weight: 500; }
.end h1 { margin: 0 0 22px; font-size: clamp(34px, 7vw, 52px); font-weight: 500; letter-spacing: -.045em; }
.score { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 11px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 999px; font: 500 11px/1 var(--mono); }
.good { color: var(--green-text); }
.bad { color: var(--red-text); }
.unsent { color: var(--yellow-text); }
.end-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.hidden { display: none !important; }
@media (max-width: 560px) {
  body { padding: 12px; }
  .session-bar { gap: 10px; }
  .brand { display: none; }
  .answer-card { padding: 20px 16px; border-radius: var(--radius-card); }
  .question-head { margin-bottom: 26px; }
  .prompt { font-size: clamp(23px, 7vw, 30px); }
  .controls { margin-top: 0; }
  .answer-row { grid-template-columns: 1fr; }
  .binary-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-fit-content>
<main class="shell">
  <header class="session-bar">
    <div class="brand-line">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand">Etude</span>
      <span class="queue" id="queueLabel"></span>
    </div>
    <div class="counter" id="counter"></div>
  </header>
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <section class="card" id="card" aria-live="polite">
    <div class="question-head"><div class="topic" id="topic"></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="answer-card ui-card" id="answerCard"><div class="controls" id="controls"></div></div>
  </section>
  <p class="hint" id="hint"></p>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE || {};
  const original = Array.isArray(data.atoms) ? data.atoms.slice() : [];
  let deck = original.slice(), index = 0, right = 0, wrong = 0, wrongCards = [], unsent = [], busy = false, selfMode = false;
  const $ = id => document.getElementById(id);

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  }
  function lightMarkdown(value) {
    let html = escapeHtml(value);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return html.replace(/\r?\n/g, '<br>');
  }
  function normalizedText(value) {
    return String(value ?? '').trim().toLocaleLowerCase().replace(/\s+/g, ' ');
  }
  function stripDuplicateHeading(prompt, topic) {
    const match = String(prompt ?? '').match(/^\s*\*\*([^*]+)\*\*\s*(?:\r?\n)+/);
    if (!match || normalizedText(match[1]) !== normalizedText(topic)) return String(prompt ?? '');
    return String(prompt).slice(match[0].length);
  }
  function accepted(atom) {
    if (atom.expected == null) return [];
    return (Array.isArray(atom.expected) ? atom.expected : [atom.expected]).map(String);
  }
  function normalize(value) { return String(value).trim().toLocaleLowerCase(); }
  function hasTag(atom, tag) {
    return Array.isArray(atom.tags) && atom.tags.some(value => normalize(value) === tag);
  }
  function isPortuguese(atom, answers = accepted(atom)) {
    return answers.some(answer => ['verdadeiro', 'falso'].includes(normalize(answer)))
      || /\b(verdadeiro|falso|uma|qual|explique)\b|[áàãâéêíóôõúç]/i.test(atom.user_prompt || '');
  }
  function uiFor(atom, answers = accepted(atom)) {
    if (isPortuguese(atom, answers)) return {
      placeholder: 'Digite sua resposta…', check: 'Verificar', show: 'Mostrar resposta',
      answerWithoutReveal: 'Responder sem revelar', correct: 'Correto', notQuite: 'Resposta incorreta', accepted: 'Aceitas',
      next: 'Próximo item', summary: 'Ver resumo', answer: 'Resposta', review: 'Rever · 1', gotIt: 'Acertei · 3',
      toAnswer: 'para responder', toCheck: 'para verificar', toContinue: 'para continuar',
      reviewAgain: 'rever', reveal: 'para revelar',
      sessionComplete: 'Sessão concluída', scoreSuffix: 'de acertos', retryMissed: 'Refazer erros',
      retryUnsent: 'Reenviar tentativas', restartAll: 'Recomeçar', saved: 'Todas as tentativas foram salvas.',
      rightNoun: 'acerto', wrongNoun: 'erro', unsentNoun: 'pendente',
    };
    return {
      placeholder: 'Type your answer…', check: 'Check answer', show: 'Show answer',
      answerWithoutReveal: 'Answer without revealing', correct: 'Correct', notQuite: 'Incorrect answer', accepted: 'Accepted',
      next: 'Next card', summary: 'See summary', answer: 'Answer', review: 'Review again · 1', gotIt: 'Got it · 3',
      toAnswer: 'to answer', toCheck: 'to check', toContinue: 'to continue',
      reviewAgain: 'review again', reveal: 'to reveal',
      sessionComplete: 'Session complete', scoreSuffix: 'correct', retryMissed: 'Retry missed cards',
      retryUnsent: 'Retry unsent attempts', restartAll: 'Restart all', saved: 'All attempts saved.',
      rightNoun: 'right', wrongNoun: 'wrong', unsentNoun: 'unsent',
    };
  }
  function displayQueueLabel(value) {
    return String(value || 'Practice queue').replace(/^Etude\s*·\s*/i, '');
  }
  function updateProgress() {
    $('counter').textContent = deck.length ? `${Math.min(index + 1, deck.length)} / ${deck.length}` : '0 / 0';
    $('fill').style.width = `${deck.length ? (Math.min(index + 1, deck.length) / deck.length) * 100 : 0}%`;
  }
  function button(label, className, handler) {
    const element = document.createElement('button');
    element.type = 'button'; element.textContent = label; element.className = className || '';
    element.addEventListener('click', handler); return element;
  }
  function buttonWithKey(label, key, handler) {
    const element = button('', 'binary-choice', handler);
    const keycap = document.createElement('span'); keycap.className = 'choice-key'; keycap.textContent = key;
    const text = document.createElement('span'); text.textContent = label;
    element.append(keycap, text); return element;
  }
  async function postAttempt(body) {
    if (!data.api) { unsent.push(body); return false; }
    try {
      const response = await fetch(`${String(data.api).replace(/\/$/, '')}/api/attempts`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return true;
    } catch (_) { unsent.push(body); return false; }
  }
  async function retryUnsent() {
    if (!unsent.length || !data.api) return;
    const pending = unsent.slice(); unsent = [];
    for (const body of pending) await postAttempt(body);
  }
  function attemptBody(atom, answer, rating) {
    const body = {atom_id: atom.id, answer, via: 'widget', mode: 'widget'};
    if (rating != null) body.rating = rating;
    return body;
  }
  function restoreQuestionStructure() {
    if ($('topic') && $('prompt') && $('controls')) return;
    $('card').innerHTML = '<div class="question-head"><div class="topic" id="topic"></div></div>'
      + '<div class="prompt" id="prompt"></div>'
      + '<div class="answer-card ui-card" id="answerCard"><div class="controls" id="controls"></div></div>';
  }
  function render() {
    busy = false; selfMode = false; updateProgress();
    if (index >= deck.length) { renderEnd(); return; }
    const atom = deck[index];
    $('card').className = 'card';
    restoreQuestionStructure();
    $('topic').textContent = atom.topic || 'Practice item';
    window.ETUDE_MD_INTO($('prompt'), stripDuplicateHeading(atom.user_prompt || '', atom.topic || ''));
    $('controls').replaceChildren(); $('hint').textContent = '';
    const answers = accepted(atom);
    if (hasTag(atom, 'true-false')) renderBinary(atom, answers);
    else if (answers.length) renderTyped(atom, answers);
    else renderFlip(atom, answers);
  }
  function binaryOptions(atom, answers) {
    const portuguese = isPortuguese(atom, answers);
    return portuguese
      ? [{label:'Verdadeiro', value:'verdadeiro'}, {label:'Falso', value:'falso'}]
      : [{label:'True', value:'true'}, {label:'False', value:'false'}];
  }
  function renderBinary(atom, answers) {
    const ui = uiFor(atom, answers);
    const grid = document.createElement('div'); grid.className = "binary-grid";
    binaryOptions(atom, answers).forEach((option, optionIndex) => {
      const choice = buttonWithKey(option.label, String(optionIndex + 1), async () => {
        if (busy) return; busy = true;
        [...grid.querySelectorAll('button')].forEach(element => { element.disabled = true; });
        const isRight = answers.some(answer => normalize(answer) === normalize(option.value));
        recordResult(atom, isRight);
        await postAttempt(attemptBody(atom, option.value));
        showTypedFeedback(isRight, answers);
      });
      grid.append(choice);
    });
    $('controls').append(grid, button(ui.show, 'secondary', () => renderFlip(atom, answers)));
    $('hint').innerHTML = isPortuguese(atom, answers)
      ? `Pressione <kbd>1</kbd> ou <kbd>2</kbd> ${ui.toAnswer}`
      : `Press <kbd>1</kbd> or <kbd>2</kbd> ${ui.toAnswer}`;
  }
  function renderTyped(atom, answers) {
    const ui = uiFor(atom, answers);
    const row = document.createElement('form'); row.className = 'answer-row';
    const input = document.createElement('input'); input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
    input.placeholder = ui.placeholder; input.setAttribute('aria-label', ui.placeholder);
    const submit = button(ui.check, 'primary'); submit.type = 'submit'; row.append(input, submit);
    row.addEventListener('submit', async event => {
      event.preventDefault(); if (busy || !input.value.trim()) return; busy = true;
      input.disabled = true; submit.disabled = true;
      const isRight = answers.some(answer => normalize(answer) === normalize(input.value));
      recordResult(atom, isRight);
      await postAttempt(attemptBody(atom, input.value));
      showTypedFeedback(isRight, answers);
    });
    $('controls').append(row, button(ui.show, 'secondary', () => renderFlip(atom, answers)));
    $('hint').innerHTML = `<kbd>Enter</kbd> ${ui.toCheck}`;
    setTimeout(() => input.focus(), 0);
  }
  function showTypedFeedback(isRight, answers) {
    const atom = deck[index];
    const ui = uiFor(atom, answers);
    const box = document.createElement('div'); box.className = `feedback ${isRight ? 'right' : 'wrong'}`;
    box.innerHTML = `<strong><span aria-hidden="true">${isRight ? '✓' : '!'}</span> ${isRight ? ui.correct : ui.notQuite}</strong><br><span class="label">${ui.accepted}: ${answers.map(lightMarkdown).join(' · ')}</span>`;
    const next = button(index + 1 < deck.length ? ui.next : ui.summary, 'primary', advance);
    $('controls').replaceChildren(box, next); $('hint').innerHTML = `<kbd>Enter</kbd> ${ui.toContinue}`; next.focus();
  }
  function renderFlip(atom, answers) {
    const ui = uiFor(atom, answers);
    selfMode = true; $('controls').replaceChildren();
    const show = button(ui.show, 'primary', () => {
      const box = document.createElement('div'); box.className = 'feedback';
      const display = answers.length ? answers.map(lightMarkdown).join(' · ') : 'No reference answer provided.';
      box.innerHTML = `<span class="label">${ui.answer}</span><br><strong class="answer">${display}</strong>`;
      const grades = document.createElement('div'); grades.className = 'grades';
      grades.append(button(ui.review, 'wrong-button', () => selfGrade(atom, false)), button(ui.gotIt, 'right-button', () => selfGrade(atom, true)));
      $('controls').replaceChildren(box, grades); $('hint').innerHTML = `<kbd>1</kbd> ${ui.reviewAgain} · <kbd>3</kbd> ${ui.gotIt.replace(' · 3', '').toLocaleLowerCase()}`;
    });
    $('controls').append(show);
    if (answers.length) $('controls').append(button(ui.answerWithoutReveal, 'secondary', () => {
      selfMode = false;
      if (hasTag(atom, 'true-false')) renderBinary(atom, answers); else renderTyped(atom, answers);
    }));
    $('hint').innerHTML = `<kbd>Space</kbd> / <kbd>Enter</kbd> ${ui.reveal}`; show.focus();
  }
  function recordResult(atom, isRight) {
    if (isRight) right += 1; else { wrong += 1; wrongCards.push(atom); }
  }
  async function selfGrade(atom, isRight) {
    if (busy) return; busy = true; recordResult(atom, isRight);
    await postAttempt(attemptBody(atom, '(self-graded)', isRight ? 3 : 0)); advance();
  }
  function advance() { index += 1; render(); }
  async function renderEnd() {
    $('fill').style.width = '100%'; $('counter').textContent = `${deck.length} / ${deck.length}`;
    if ($('topic')) $('topic').textContent = '';
    await retryUnsent();
    $('card').className = 'card end ui-card';
    const uniqueWrong = [...new Map(wrongCards.map(atom => [atom.id, atom])).values()];
    const atom = original[0] || {};
    const ui = uiFor(atom, accepted(atom));
    const percentage = right + wrong ? Math.round(right / (right + wrong) * 100) : 0;
    const plural = (count, noun) => isPortuguese(atom) && count !== 1 ? `${noun}s` : noun;
    $('card').innerHTML = `<div class="completion-label">${ui.sessionComplete}</div><h1>${percentage}% ${ui.scoreSuffix}</h1><div class="score"><span class="chip good">${right} ${plural(right, ui.rightNoun)}</span><span class="chip bad">${wrong} ${plural(wrong, ui.wrongNoun)}</span><span class="chip unsent">${unsent.length} ${plural(unsent.length, ui.unsentNoun)}</span></div><div class="end-actions" id="endActions"></div>`;
    const actions = $('endActions');
    if (uniqueWrong.length) actions.append(button(ui.retryMissed, 'primary', () => { deck = uniqueWrong; index = right = wrong = 0; wrongCards = []; render(); }));
    if (unsent.length) actions.append(button(ui.retryUnsent, '', async () => { await retryUnsent(); renderEnd(); }));
    actions.append(button(ui.restartAll, '', () => { deck = original.slice(); index = right = wrong = 0; wrongCards = []; render(); }));
    $('hint').textContent = unsent.length ? 'Some attempts could not reach Etude. Keep this page open and retry.' : ui.saved;
  }
  document.addEventListener('keydown', event => {
    if (event.target instanceof HTMLInputElement) return;
    if (!selfMode && document.querySelector('.binary-grid') && (event.key === '1' || event.key === '2')) {
      const choices = [...document.querySelectorAll('.binary-grid button')];
      const selected = choices[Number(event.key) - 1]; if (selected) { event.preventDefault(); selected.click(); }
      return;
    }
    if (event.key === 'Enter' || (event.key === ' ' && selfMode)) {
      const focused = document.activeElement;
      if (focused instanceof HTMLButtonElement) { event.preventDefault(); focused.click(); }
    }
    if (selfMode && (event.key === '1' || event.key === '3')) {
      const buttons = [...document.querySelectorAll('.grades button')];
      const selected = event.key === '1' ? buttons[0] : buttons[1]; if (selected) selected.click();
    }
  });
  $('queueLabel').textContent = displayQueueLabel(data.queue_label || data.queue);
  render();
})();
</script>
</body>
</html>
