<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Markdown</title>
/*__MARKDOWN_EDITOR__*/
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { overflow-y: hidden; }
body { margin: 0; color: var(--text-primary); font: 16px/1.7 var(--sans); }
.wrap { display: flex; flex-direction: column; padding: 22px 26px 14px; }
.label { color: var(--text-muted); font: 500 13px/1.3 var(--sans); letter-spacing: .01em; }
h1.title { margin: 2px 0 0; font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.prompt { margin: 14px 0 0; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.prompt p { margin: 0 0 8px; } .prompt p:last-child { margin-bottom: 0; }
.prompt code { padding: 1px 5px; background: var(--surface-2); border-radius: 4px; font: 13px/1.4 var(--mono); }
.prompt pre { margin: 8px 0 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; overflow-x: auto; font: 12.5px/1.5 var(--mono); }

/* One document, Obsidian-style: the line under the cursor shows its raw
   markdown, every other line shows the rendered result. */
.editor { margin-top: 16px; border: 0.5px solid var(--border); border-radius: var(--radius-card, 12px); background: var(--surface-1); overflow: hidden; }
.cm-editor, .cm-editor .cm-content, .cm-editor .cm-scroller, .cm-editor .cm-line {
  font-family: var(--sans) !important; font-size: 15px; line-height: 1.75; }
.cm-editor { background: transparent; }
/* Inline code and fences keep the mono stack. */
.cm-editor .cm-line span[class*="tok-monospace"] { font-family: var(--mono) !important; }
.cm-editor.cm-focused { outline: none; }
.cm-editor .cm-content { padding: 20px 0; caret-color: var(--foreground); min-height: 240px; }
.cm-editor .cm-line { padding: 0 26px; }
.cm-cursor, .cm-dropCursor { border-left-color: var(--foreground); }
.cm-editor .cm-activeLine { background: transparent; }
.cm-selectionBackground, .cm-editor .cm-selectionBackground,
.cm-editor.cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--accent-strong, var(--accent)) 32%, transparent) !important; }
.cm-editor {
  --md-code: var(--green-text);
  --md-link: var(--accent-text);
  --md-quote: var(--text-secondary);
  --md-marker: var(--text-muted);
}
.cm-bullet { color: var(--text-muted); }
.cm-task { display: inline-block; width: 1em; color: var(--text-muted); }
.cm-task-done { color: var(--green-text); }
.cm-rule { display: inline-block; width: 100%; border-top: 0.5px solid var(--border); vertical-align: middle; }
.cm-math { color: var(--text-primary); }
.cm-math-block { display: block; text-align: center; margin: 6px 0; }
.cm-math-error { color: var(--red-text); font: 13px/1.5 var(--mono); }
.cm-math .katex-display { margin: 4px 0; }
.hint { margin-top: 9px; color: var(--text-muted); font-size: 11.5px; line-height: 1.5; }
.tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.spacer { flex: 1 1 auto; }
.counts { color: var(--text-muted); font: 500 11.5px/1.5 var(--mono); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.status:not(:empty) { margin-top: 10px; color: var(--text-secondary); font: 12.5px/1.5 var(--mono); }
.status[data-tone="error"] { color: var(--red-text); }
.done { margin-top: 14px; padding: 20px; text-align: center; background: var(--surface-1); border: 0.5px solid var(--green); border-radius: var(--radius-card, 12px); }
.done h2 { margin: 0 0 6px; font-size: 16px; font-weight: 500; }
.done p { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
.hidden { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-fit-content>
<div class="wrap">
  <div class="label" id="label">Etude · Written answer</div>
  <h1 class="title" id="title">Compose your answer</h1>
  <div class="prompt" id="prompt"></div>
  <div class="editor ui-card" id="editor"></div>
  <div class="hint" id="hint"></div>
  <div class="tools">
    <span class="counts" id="counts"></span>
    <span class="spacer"></span>
    <button class="ui-button ui-button--outline ui-button--sm" id="clear" type="button">Clear</button>
    <button class="ui-button ui-button--sm" id="submit" type="button" disabled>Send to agent</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="done hidden" id="done">
    <h2 id="doneTitle">Sent to your agent</h2>
    <p id="doneBody">Your answer is waiting in Etude. Tell your agent you are done so they can review it.</p>
  </div>
</div>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const atom = data.atom && typeof data.atom === 'object' ? data.atom : {};
  const $ = id => document.getElementById(id);
  const text = value => (typeof value === 'string' ? value : '');
  // Heading is a single line: strip markers instead of rendering them.
  const plain = value => String(value || '').replace(/`{1,3}|\*{1,2}|[_#>]/g, '').replace(/\s+/g, ' ').trim();
  const api = String(data.api || '').replace(/\/$/, '');

  const portuguese = /[áàãâéêíóôõúç]|\b(explique|descreva|resposta|justifique|escreva)\b/i
    .test(`${text(atom.user_prompt)} ${text(atom.topic)}`);
  const ui = portuguese
    ? { title: 'Escreva sua resposta', label: 'Etude · Resposta escrita', send: 'Enviar ao agente',
        clear: 'Limpar', sending: 'Enviando…', empty: 'Escreva algo antes de enviar.',
        failed: 'Não foi possível alcançar o Etude. Seu texto continua aqui — tente de novo.',
        sentTitle: 'Enviado ao agente', words: 'palavras', chars: 'caracteres',
        hint: 'Formata enquanto você escreve. A linha do cursor mostra a sintaxe crua — clique fora para ver renderizado. Matemática: $inline$ e $$bloco$$.',
        sentBody: 'Sua resposta está aguardando no Etude. Avise o agente que terminou para receber o feedback.' }
    : { title: 'Compose your answer', label: 'Etude · Written answer', send: 'Send to agent',
        clear: 'Clear', sending: 'Sending…', empty: 'Write something before sending.',
        failed: 'Could not reach Etude. Your text is still here — try again.',
        sentTitle: 'Sent to your agent', words: 'words', chars: 'chars',
        hint: 'Formats as you type. The cursor line shows raw syntax — click away to see it rendered. Math: $inline$ and $$block$$.',
        sentBody: 'Your answer is waiting in Etude. Tell your agent you are done so they can review it.' };

  if (portuguese) document.documentElement.lang = 'pt-BR';
  $('label').textContent = text(atom.id) ? `${ui.label} · ${text(atom.id)}` : ui.label;
  $('title').textContent = plain(atom.topic) || ui.title;
  const promptText = text(atom.user_prompt) || ui.title;
  $('title').hidden = window.ETUDE_MD_HAS_LEADING_HEADING(promptText);
  window.ETUDE_MD_INTO($('prompt'), promptText);
  $('hint').textContent = ui.hint;
  $('clear').textContent = ui.clear;
  $('submit').textContent = ui.send;
  $('doneTitle').textContent = ui.sentTitle;
  $('doneBody').textContent = ui.sentBody;

  let sent = false;
  let editor = null;

  function refresh() {
    const value = editor ? editor.getValue() : '';
    const words = value.trim() ? value.trim().split(/\s+/).length : 0;
    $('counts').textContent = `${words} ${ui.words} · ${value.length} ${ui.chars}`;
    $('submit').disabled = sent || !value.trim();
    $('clear').disabled = sent || !value;
  }

  if (window.ETUDE_MDE) {
    editor = window.ETUDE_MDE.createMarkdownEditor({ parent: $('editor'), doc: '', onChange: refresh });
    // Exposed so the widget can be driven and inspected in tests.
    window.__etudeEditor = editor;
  } else {
    // Bundle failed to load: a plain textarea still lets the user answer.
    const area = document.createElement('textarea');
    area.style.cssText = 'width:100%;min-height:240px;padding:16px 18px;border:0;background:transparent;color:inherit;font:15px/1.75 var(--sans);resize:vertical;';
    area.addEventListener('input', refresh);
    $('editor').append(area);
    editor = { getValue: () => area.value, setValue: value => { area.value = value; }, focus: () => area.focus() };
  }

  $('clear').addEventListener('click', () => { editor.setValue(''); refresh(); editor.focus(); });

  function setStatus(message, tone) {
    const node = $('status');
    node.textContent = message;
    if (tone) node.dataset.tone = tone; else delete node.dataset.tone;
  }

  $('submit').addEventListener('click', async () => {
    const value = editor.getValue().trim();
    if (sent || !value) { if (!value) setStatus(ui.empty, 'error'); return; }
    const atomId = text(atom.id);
    if (!atomId || !api) { setStatus(ui.failed, 'error'); return; }

    $('submit').disabled = true;
    setStatus(ui.sending);
    try {
      const response = await fetch(`${api}/api/inbox`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          atom_id: atomId,
          payload: { kind: 'markdown', text: value, chars: value.length },
          ts: new Date().toISOString(),
        }),
      });
      if (!response.ok) throw new Error(String(response.status));
      sent = true;
      refresh();
      $('done').classList.remove('hidden');
      setStatus('');
      window.parent.postMessage({
        lotus: 1,
        type: 'submit',
        text: `I submitted a written answer for ${atomId} via the markdown canvas. Read it from the Etude inbox, grade it, and record the attempt.`,
      }, '*');
    } catch {
      $('submit').disabled = false;
      setStatus(ui.failed, 'error');
    }
  });

  refresh();
})();
</script>
</body>
</html>
