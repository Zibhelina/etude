<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Matching pairs</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 0; }
body { margin: 0; padding: 24px; background: var(--surface-0); color: var(--text-primary); font: 16px/1.7 var(--sans); display: grid; place-items: center; }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.shell { width: min(860px, 100%); }
header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 22px; }
.eyebrow { color: var(--accent-text); font: 500 12px/1 var(--mono); letter-spacing: .02em; }
h1 { margin: 8px 0 0; font-size: clamp(25px, 5vw, 38px); font-weight: 500; letter-spacing: -.025em; }
.meta { color: var(--text-secondary); font: 500 13px/1.4 var(--mono); text-align: right; }
.board { padding: clamp(18px, 4vw, 32px); background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius-card); }
.instructions { margin: 0 0 22px; color: var(--text-secondary); line-height: 1.5; }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px clamp(18px, 5vw, 46px); }
.column { display: grid; align-content: start; gap: 10px; }
.pair {
  min-height: 62px; padding: 13px 16px; border: 0.5px solid var(--border); border-radius: var(--radius-control);
  color: var(--text-primary); background: var(--surface-2); cursor: pointer; font-size: clamp(16px, 2.5vw, 19px); line-height: 1.35;
  transition: transform .14s ease, border-color .14s ease, opacity .14s ease;
}
.pair:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.pair.selected { border-color: var(--accent); }
.pair.matched { color: var(--green-text); border-color: var(--green); background: var(--surface-1); cursor: default; opacity: .76; }
.pair.mismatch { color: var(--red-text); border-color: var(--red); animation: shake .25s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; }
.status { color: var(--text-secondary); font: 13px/1.4 var(--mono); }
.submit { padding: 13px 20px; color: var(--on-accent); background: var(--accent-strong); border: 0.5px solid var(--accent-strong); border-radius: var(--radius-control); cursor: pointer; font-weight: 500; }
.submit:disabled { color: var(--text-muted); background: var(--surface-2); border-color: var(--border); cursor: not-allowed; }
.confirmation { min-height: 0; padding: clamp(28px, 5vw, 40px); display: grid; place-items: center; text-align: center; background: var(--surface-1); border: 0.5px solid var(--green); border-radius: var(--radius-card); }
.confirmation h2 { margin: 14px 0 8px; font-size: clamp(28px, 5vw, 42px); font-weight: 500; }
.confirmation p { max-width: 520px; margin: 0; color: var(--text-secondary); font-size: 18px; line-height: 1.55; }
.check { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; color: var(--surface-0); background: var(--green); font-size: 28px; font-weight: 500; }
.error { color: var(--red-text); }
.hidden { display: none; }
@media (max-width: 600px) { body { padding: 14px; } header { align-items: start; flex-direction: column; } .meta { text-align: left; } .columns { gap: 10px; } .pair { min-height: 70px; padding: 10px; } .footer { align-items: stretch; flex-direction: column; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-fit-content>
<main class="shell">
  <header><div><div class="eyebrow" id="eyebrow">Etude · Match</div><h1 id="title">Connect the pairs</h1></div><div class="meta" id="meta"></div></header>
  <section class="board ui-card" id="board">
    <p class="instructions" id="instructions">Choose one item from each column. Matched pairs lock in place.</p>
    <div class="columns"><div class="column" id="leftColumn" aria-label="Left choices"></div><div class="column" id="rightColumn" aria-label="Right choices"></div></div>
    <div class="footer"><div class="status" id="status" aria-live="polite"></div><button class="submit" id="submit" type="button">Submit</button></div>
  </section>
  <section class="confirmation hidden" id="confirmation" aria-live="polite"></section>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  // The owning atom exposes widget_data.pairs as [left, right] tuples.
  const data = ETUDE || {}, atom = Array.isArray(data.atoms) ? data.atoms[0] : null;
  const widgetData = atom && atom.widget_data && typeof atom.widget_data === 'object' ? atom.widget_data : {};
  const sourcePairs = Array.isArray(widgetData.pairs) ? widgetData.pairs.filter(pair => Array.isArray(pair) && pair.length >= 2) : [];
  const startedAt = Date.now();
  let selectedLeft = null, selectedRight = null, mismatchCount = 0, locked = new Set(), proposals = [], resolving = false, sent = false;
  const $ = id => document.getElementById(id);
  function isPortuguese(value) {
    return /\b(associe|associação|cada|código|significado|opções)\b|[áàãâéêíóôõúç]/i.test(String(value || ''));
  }
  function uiFor(value) {
    if (isPortuguese(value)) return {
      eyebrow: 'Etude · Associação', title: 'Associe os pares',
      instructions: 'Escolha um item de cada coluna. Pares corretos ficam bloqueados.',
      leftChoices: 'Opções da esquerda', rightChoices: 'Opções da direita',
      matched: 'associados', mismatch: 'erro', mismatches: 'erros', noMatch: 'Não é um par. Tente novamente.',
      send: 'Enviar ao agente', submit: 'Enviar progresso', sending: 'Enviando…', sendingWork: 'Enviando seu trabalho…',
      sentTitle: 'Enviado ao agente', sentBody: 'Sua tentativa está aguardando no Etude. Avise que terminou para ela ser revisada com você.',
      retry: 'Tentar envio novamente', unavailable: 'Não foi possível alcançar o Etude. Seu trabalho continua aqui. Tente novamente quando o servidor estiver disponível.',
      empty: 'Nenhum par foi fornecido.', mode: 'Exercício avaliado pelo agente',
    };
    return {
      eyebrow: 'Etude · Match', title: 'Connect the pairs',
      instructions: 'Choose one item from each column. Matched pairs lock in place.',
      leftChoices: 'Left choices', rightChoices: 'Right choices',
      matched: 'matched', mismatch: 'mismatch', mismatches: 'mismatches', noMatch: 'Not a match. Try again.',
      send: 'Send to agent', submit: 'Submit current work', sending: 'Sending…', sendingWork: 'Sending your work…',
      sentTitle: 'Sent to your agent', sentBody: 'Your matching attempt is waiting in Etude. Tell your agent you are done so they can review it with you.',
      retry: 'Retry send', unavailable: 'Could not reach Etude. Your work is still here. Retry when the server is available.',
      empty: 'No matching pairs were provided.', mode: 'Agent-assisted exercise',
    };
  }
  const ui = uiFor(atom && atom.user_prompt);
  function cleanInstruction(value) {
    const source = String(value || '').trim();
    const listItems = (source.match(/^\s*[-*+]\s+/gm) || []).length;
    const cleaned = source
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/\*\*|__|`/g, '')
      .replace(/^\s*#{1,6}\s*/gm, '')
      .replace(/^\s*[-*+]\s+/gm, '')
      .replace(/\s+/g, ' ')
      .replace(/^Matching\s*\/\s*associação\s*/i, '')
      .trim();
    return !cleaned || listItems >= 2 || cleaned.length > 180 ? ui.instructions : cleaned;
  }
  const shuffle = values => {
    const result = values.slice();
    for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; }
    return result;
  };
  const entries = sourcePairs.map((pair, index) => ({index, left: String(pair[0]), right: String(pair[1])}));
  const leftItems = shuffle(entries.map(entry => ({id: entry.index, value: entry.left})));
  const rightItems = shuffle(entries.map(entry => ({id: entry.index, value: entry.right})));

  function makeChoice(side, item) {
    const button = document.createElement('button'); button.type = 'button'; button.className = 'pair';
    button.textContent = item.value; button.dataset.id = String(item.id); button.dataset.side = side;
    button.setAttribute('aria-pressed', 'false');
    button.addEventListener('click', () => choose(button, side, item)); return button;
  }
  function choose(button, side, item) {
    if (resolving || locked.has(item.id) || button.disabled) return;
    const previous = side === 'left' ? selectedLeft : selectedRight;
    if (previous) { previous.button.classList.remove('selected'); previous.button.setAttribute('aria-pressed', 'false'); }
    button.classList.add('selected');
    button.setAttribute('aria-pressed', 'true');
    if (side === 'left') selectedLeft = {button, item}; else selectedRight = {button, item};
    if (selectedLeft && selectedRight) resolveSelection();
  }
  function resolveSelection() {
    resolving = true;
    const left = selectedLeft, right = selectedRight;
    proposals.push([left.item.value, right.item.value]);
    if (left.item.id === right.item.id) {
      locked.add(left.item.id);
      for (const choice of [left.button, right.button]) { choice.classList.remove('selected'); choice.classList.add('matched'); choice.setAttribute('aria-pressed', 'false'); choice.setAttribute('aria-label', `${choice.textContent}, ${ui.matched}`); choice.disabled = true; }
      clearSelection(); updateStatus(); resolving = false;
      if (locked.size === entries.length) submit();
    } else {
      mismatchCount += 1;
      left.button.classList.add('mismatch'); right.button.classList.add('mismatch'); updateStatus(ui.noMatch);
      setTimeout(() => {
        for (const choice of [left.button, right.button]) { choice.classList.remove('selected', 'mismatch'); choice.setAttribute('aria-pressed', 'false'); }
        clearSelection(); resolving = false; updateStatus();
      }, 520);
    }
  }
  function clearSelection() { selectedLeft = selectedRight = null; }
  function updateStatus(message) {
    $('status').textContent = message || `${locked.size} ${isPortuguese(atom && atom.user_prompt) ? 'de' : 'of'} ${entries.length} ${ui.matched} · ${mismatchCount} ${mismatchCount === 1 ? ui.mismatch : ui.mismatches}`;
    $('submit').disabled = sent || !atom || !entries.length;
    $('submit').textContent = locked.size === entries.length ? ui.send : ui.submit;
  }
  async function submit() {
    if (sent || !atom || !entries.length) return;
    sent = true; $('submit').disabled = true; $('submit').textContent = ui.sending; updateStatus(ui.sendingWork);
    const body = {atom_id: atom.id, payload: {matches: proposals.slice(), mismatch_count: mismatchCount, duration_s: Math.max(0, Math.round((Date.now() - startedAt) / 1000))}, ts: new Date().toISOString()};
    try {
      const response = await fetch(`${String(data.api || '').replace(/\/$/, '')}/api/inbox`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      $('board').classList.add('hidden'); $('confirmation').classList.remove('hidden');
      $('confirmation').innerHTML = `<div><div class="check" aria-hidden="true">✓</div><h2>${ui.sentTitle}</h2><p>${ui.sentBody}</p></div>`;
    } catch (_) {
      sent = false; $('submit').disabled = false; $('submit').textContent = ui.retry;
      $('status').innerHTML = `<span class="error"><span aria-hidden="true">!</span> ${ui.unavailable}</span>`;
    }
  }
  $('leftColumn').append(...leftItems.map(item => makeChoice('left', item)));
  $('rightColumn').append(...rightItems.map(item => makeChoice('right', item)));
  $('eyebrow').textContent = ui.eyebrow;
  $('title').textContent = (atom && atom.topic) || ui.title;
  $('instructions').textContent = cleanInstruction(atom && atom.user_prompt);
  $('leftColumn').setAttribute('aria-label', ui.leftChoices);
  $('rightColumn').setAttribute('aria-label', ui.rightChoices);
  $('meta').textContent = String(data.queue_label || data.queue || ui.mode).replace(/^Etude\s*·\s*/i, '');
  $('submit').addEventListener('click', submit);
  updateStatus(entries.length ? '' : ui.empty);
})();
</script>
</body>
</html>
