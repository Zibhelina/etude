<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Queue items</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { min-height: 0; }
body { margin: 0; color: var(--text-primary); font: 16px/1.7 var(--sans); }
.wrap { padding: 22px 24px 24px; }
.header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.eyebrow { color: var(--text-secondary); font: 500 13px/1.3 var(--sans); letter-spacing: .01em; }
h1 { margin: 3px 0 0; font-size: 19px; line-height: 1.3; font-weight: 500; letter-spacing: -.015em; overflow-wrap: anywhere; }
.summary { flex: 0 0 auto; color: var(--text-secondary); font: 12px/1.4 var(--mono); white-space: nowrap; }
.table-shell { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none; overscroll-behavior-x: contain; border: 0.5px solid var(--border); border-radius: var(--radius-card); background: var(--surface-1); }
.table-shell::-webkit-scrollbar { display: none; }
table { width: 100%; min-width: 640px; border-collapse: collapse; table-layout: auto; }
col.pos { width: 48px; }
col.item { width: 45%; }
col.mode { width: 1%; }
col.state { width: 1%; }
col.number { width: 1%; }
thead { background: var(--surface-2); }
th { padding: 10px 12px; color: var(--text-secondary); font-size: 12px; line-height: 1.2; font-weight: 500; letter-spacing: .02em; text-align: left; white-space: nowrap; }
th.numeric, td.numeric { text-align: right; }
tbody tr { border-top: 0.5px solid var(--border); }
tbody tr:first-child { border-top: 0; }
tbody tr:hover { background: var(--surface-2); }
td { padding: 11px 12px; vertical-align: middle; }
th, td { white-space: nowrap; }
td.identity { white-space: normal; max-width: 0; }
.position { color: var(--text-muted); font: 12px/1 var(--mono); }
.identity { min-width: 0; }
.identity-top { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.atom-id { flex: 0 0 auto; color: var(--accent-text); font: 500 11.5px/1.3 var(--mono); }
.topic { min-width: 0; overflow: hidden; color: var(--text-primary); font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.prompt { margin-top: 3px; overflow: hidden; color: var(--text-secondary); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; flex: none; gap: 7px; padding: 4px 8px; border: 0.5px solid var(--border); border-radius: 999px; color: var(--text-secondary); font-size: 11.5px; white-space: nowrap; }
.mode-short { display: none; }
.pill::before { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); content: ''; }
.pill[data-mode="deterministic"]::before { background: var(--aqua); }
.pill[data-mode="agent"]::before { background: var(--violet); }
.state { color: var(--text-secondary); font-size: 12px; }
.state::before { margin-right: 5px; content: '○'; }
.state[data-state="new"] { color: var(--text-secondary); }
.state[data-state="learning"] { color: var(--yellow-text); }
.state[data-state="learning"]::before { content: '◐'; }
.state[data-state="review"] { color: var(--green-text); }
.state[data-state="review"]::before { content: '✓'; }
.metric { color: var(--text-secondary); font: 12px/1 var(--mono); }
.empty { padding: 32px 20px; color: var(--text-muted); text-align: center; }
@media (max-width: 720px) {
  .wrap { padding: 18px 14px; }
  .header { align-items: flex-start; flex-direction: column; gap: 6px; }
  th, td { padding-left: 8px; padding-right: 8px; }
  .pill { padding: 4px 7px; }
  .prompt { display: none; }
}
@media (max-width: 560px) {
  .mode-full { display: none; }
  .mode-short { display: inline; }
}
</style>
</head>
<body data-fit-content>
<main class="wrap ui-card">
  <header class="header">
    <div>
      <div class="eyebrow" id="eyebrow">Practice items</div>
      <h1 id="queueLabel">Untitled queue</h1>
    </div>
    <div class="summary" id="summary">0 items</div>
  </header>
  <div class="table-shell">
    <table aria-label="Practice items in queue">
      <colgroup>
        <col class="pos"><col class="item"><col class="mode"><col class="state"><col class="number attempts"><col class="number streak">
      </colgroup>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col" id="itemHeading">Item</th>
          <th scope="col" id="modeHeading">Mode</th>
          <th scope="col" id="stateHeading">State</th>
          <th scope="col" class="numeric" id="attemptsHeading">Attempts</th>
          <th scope="col" class="numeric" id="streakHeading">Streak</th>
        </tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No practice items in this queue.</div>
  </div>
</main>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const items = Array.isArray(data.items) ? data.items : [];
  const $ = id => document.getElementById(id);
  const whole = value => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : 0;
  const firstLine = value => String(value || '').replace(/[*_`#>]/g, '').split(/\n+/).find(line => line.trim())?.trim() || 'No prompt';
  function isPortuguese() {
    const sample = [data.queue_label, ...items.slice(0, 6).flatMap(item => [item.topic, item.user_prompt])].join(' ');
    return /[ãõçáéíóú]|\b(?:resposta|qual|explique|verdadeiro|prática|código|com|uma)\b/i.test(sample);
  }
  const portuguese = isPortuguese();
  const modeLabel = mode => mode === 'deterministic'
    ? (portuguese ? 'Determinístico' : 'Deterministic')
    : (portuguese ? 'Agente' : 'Agent');
  const compactModeLabel = mode => mode === 'deterministic' ? 'Det.' : (portuguese ? 'Agente' : 'Agent');
  const stateLabel = state => (portuguese
    ? {new: 'Novo', learning: 'Aprendendo', review: 'Revisão'}
    : {new: 'New', learning: 'Learning', review: 'Review'})[state] || String(state || (portuguese ? 'Desconhecido' : 'Unknown'));

  if (portuguese) {
    document.documentElement.lang = 'pt-BR';
    $('eyebrow').textContent = 'Itens de prática';
    $('itemHeading').textContent = 'Item';
    $('modeHeading').textContent = 'Correção';
    $('stateHeading').textContent = 'Estado';
    $('attemptsHeading').textContent = 'Tentativas';
    $('streakHeading').textContent = 'Sequência';
    document.querySelector('table').setAttribute('aria-label', 'Itens de prática na queue');
    $('empty').textContent = 'Nenhum item de prática nesta queue.';
  }

  $('queueLabel').textContent = data.queue_label || data.queue || 'Untitled queue';
  const deterministic = items.filter(item => item.mode === 'deterministic').length;
  const agent = items.length - deterministic;
  $('summary').textContent = portuguese
    ? `${items.length} ${items.length === 1 ? 'item' : 'itens'} · ${deterministic} determinísticos · ${agent} pelo agente`
    : `${items.length} ${items.length === 1 ? 'item' : 'items'} · ${deterministic} deterministic · ${agent} agent`;

  if (!items.length) {
    document.querySelector('table').hidden = true;
    $('empty').hidden = false;
    return;
  }

  items.forEach(item => {
    const row = document.createElement('tr');

    const position = document.createElement('td');
    position.className = 'position';
    position.textContent = whole(item.position);

    const identityCell = document.createElement('td');
    const identity = document.createElement('div');
    identity.className = 'identity';
    const top = document.createElement('div');
    top.className = 'identity-top';
    const atomId = document.createElement('span');
    atomId.className = 'atom-id';
    atomId.textContent = item.id || '—';
    const topic = document.createElement('span');
    topic.className = 'topic';
    topic.textContent = item.topic || firstLine(item.user_prompt);
    const prompt = document.createElement('div');
    prompt.className = 'prompt';
    prompt.textContent = firstLine(item.user_prompt);
    top.append(atomId, topic);
    identity.append(top, prompt);
    identityCell.append(identity);

    const modeCell = document.createElement('td');
    const mode = document.createElement('span');
    mode.className = 'pill';
    mode.dataset.mode = item.mode || 'agent';
    const modeFull = document.createElement('span');
    modeFull.className = 'mode-full';
    modeFull.textContent = modeLabel(item.mode);
    const modeShort = document.createElement('span');
    modeShort.className = 'mode-short';
    modeShort.textContent = compactModeLabel(item.mode);
    mode.append(modeFull, modeShort);
    modeCell.append(mode);

    const stateCell = document.createElement('td');
    const state = document.createElement('span');
    state.className = 'state';
    state.dataset.state = item.state || '';
    state.textContent = stateLabel(item.state);
    stateCell.append(state);

    const attempts = document.createElement('td');
    attempts.className = 'numeric metric';
    attempts.textContent = whole(item.attempt_count);

    const streak = document.createElement('td');
    streak.className = 'numeric metric';
    streak.textContent = whole(item.streak);

    row.append(position, identityCell, modeCell, stateCell, attempts, streak);
    $('items').append(row);
  });
})();
</script>
</body>
</html>
