<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Session summary</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { overflow-y: hidden; }
body { margin: 0; color: var(--text-primary); font: 16px/1.7 var(--sans); }
.wrap { display: flex; flex-direction: column; padding: 22px 26px 20px; }
.label { color: var(--text-muted); font: 500 13px/1.3 var(--sans); letter-spacing: .01em; }
h1 { margin: 2px 0 0; font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.stats { display: flex; margin-top: 20px; }
.stat { flex: 1; min-width: 0; }
.stat + .stat { padding-left: 22px; border-left: 0.5px solid var(--border); margin-left: 22px; }
.stat .v { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
.stat .k { margin-top: 2px; color: var(--text-secondary); font-size: 12.5px; }
.bar { display: flex; height: 8px; margin-top: 22px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.seg { min-width: 0; }
.seg[data-band="3"] { background: var(--green); }
.seg[data-band="2"] { background: color-mix(in srgb, var(--green) 55%, var(--surface-2)); }
.seg[data-band="1"] { background: var(--yellow); }
.seg[data-band="0"] { background: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; color: var(--text-secondary); font: 500 11.5px/1.5 var(--mono); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.swatch[data-band="3"] { background: var(--green); }
.swatch[data-band="2"] { background: color-mix(in srgb, var(--green) 55%, var(--surface-2)); }
.swatch[data-band="1"] { background: var(--yellow); }
.swatch[data-band="0"] { background: var(--red); }
h2 { margin: 24px 0 0; padding-top: 18px; border-top: 0.5px solid var(--border); font-size: 13px; font-weight: 500; color: var(--text-secondary); letter-spacing: .01em; }
.items { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 13px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius-card, 12px); }
.rating { font: 500 11px/1.6 var(--mono); border-radius: 999px; padding: 1px 9px; background: var(--surface-2); color: var(--text-secondary); flex: none; }
.rating[data-band="3"], .rating[data-band="2"] { background: color-mix(in srgb, var(--green) 22%, var(--surface-2)); color: var(--green-text); }
.rating[data-band="1"] { background: color-mix(in srgb, var(--yellow) 22%, var(--surface-2)); color: var(--yellow-text); }
.rating[data-band="0"] { background: color-mix(in srgb, var(--red) 22%, var(--surface-2)); color: var(--red-text); }
.item-id { font: 500 11.5px/1.5 var(--mono); color: var(--text-secondary); flex: none; }
.item-topic { font-size: 13.5px; line-height: 1.5; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { margin-top: 18px; padding: 22px; text-align: center; color: var(--text-secondary); background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius-card, 12px); font-size: 13.5px; }
</style>
</head>
<body data-fit-content>
<div class="wrap ui-card">
  <div class="label" id="label">Etude session</div>
  <h1 id="title">Session summary</h1>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar" role="img" aria-label="Rating distribution"></div>
  <div class="legend" id="legend"></div>
  <h2 id="itemsHeading">Items practiced</h2>
  <ul class="items" id="items"></ul>
</div>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const $ = id => document.getElementById(id);
  const text = value => (typeof value === 'string' ? value : '');
  const whole = value => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : 0;
  const items = Array.isArray(data.items) ? data.items.filter(i => i && typeof i === 'object') : [];

  if (text(data.queue_label)) $('label').textContent = `Etude session · ${text(data.queue_label)}`;
  const hours = whole(data.hours);
  if (hours) $('title').textContent = `Last ${hours} hours`;

  const dist = data.ratings && typeof data.ratings === 'object' ? data.ratings : {};
  const counts = [0, 1, 2, 3].map(band => whole(dist[band]));
  const attempts = whole(data.attempts) || counts.reduce((sum, count) => sum + count, 0);
  const rated = counts.reduce((sum, count) => sum + count, 0);
  const mean = rated ? counts.reduce((sum, count, band) => sum + count * band, 0) / rated : null;

  const stats = [
    { k: 'Attempts', v: attempts.toLocaleString() },
    { k: 'Items', v: whole(data.unique_items || items.length).toLocaleString() },
    { k: 'Mean score', v: mean === null ? '—' : mean.toFixed(1), unit: mean === null ? '' : '/ 3' },
  ];
  stats.forEach(entry => {
    const cell = document.createElement('div');
    cell.className = 'stat';
    const value = document.createElement('div');
    value.className = 'v';
    value.textContent = entry.v;
    if (entry.unit) {
      const unit = document.createElement('small');
      unit.textContent = entry.unit;
      value.append(unit);
    }
    const key = document.createElement('div');
    key.className = 'k';
    key.textContent = entry.k;
    cell.append(value, key);
    $('stats').append(cell);
  });

  const NAME = { 0: 'fail', 1: 'hard', 2: 'good', 3: 'easy' };
  const bar = $('bar');
  const legend = $('legend');
  if (!rated) {
    bar.remove();
    legend.remove();
  } else {
    [3, 2, 1, 0].forEach(band => {
      const count = counts[band];
      if (!count) return;
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.dataset.band = String(band);
      seg.style.flex = `${count} 1 0`;
      bar.append(seg);

      const key = document.createElement('span');
      key.className = 'key';
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.dataset.band = String(band);
      const text_ = document.createElement('span');
      text_.textContent = `${NAME[band]} ${count}`;
      key.append(swatch, text_);
      legend.append(key);
    });
    bar.setAttribute('aria-label',
      `Rating distribution: ${[3, 2, 1, 0].map(band => `${NAME[band]}, ${counts[band]}`).join('; ')}`);
  }

  const list = $('items');
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No attempts recorded in this window.';
    $('itemsHeading').remove();
    list.replaceWith(empty);
    return;
  }

  items.forEach(item => {
    const row = document.createElement('li');
    row.className = 'item';
    const rating = Number(item.last_rating);
    const chip = document.createElement('span');
    chip.className = 'rating';
    if (Number.isFinite(rating)) {
      chip.dataset.band = String(rating);
      chip.textContent = `${rating} · ${NAME[rating] || 'rated'}`;
    } else {
      chip.textContent = 'unrated';
    }
    const id = document.createElement('span');
    id.className = 'item-id';
    id.textContent = text(item.id);
    const topic = document.createElement('span');
    topic.className = 'item-topic';
    topic.textContent = text(item.topic) || text(item.user_prompt);
    row.append(chip, id, topic);
    list.append(row);
  });
})();
</script>
</body>
</html>
