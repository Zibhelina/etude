<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Etude · Tag breakdown</title>
<style>
/*__THEME__*/
* { box-sizing: border-box; }
html, body { overflow-y: hidden; }
body { margin: 0; color: var(--text-primary); font: 16px/1.7 var(--sans); }
.wrap { display: flex; flex-direction: column; padding: 22px 26px 14px; }
.label { color: var(--text-muted); font: 500 13px/1.3 var(--sans); letter-spacing: .01em; }
h1 { margin: 2px 0 0; font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.rows { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.name { font: 500 12.5px/1.5 var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.figs { color: var(--text-muted); font: 500 11.5px/1.5 var(--mono); white-space: nowrap; }
.meter { position: relative; height: 6px; margin-top: 7px; background: var(--border-strong); border-radius: 999px; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--status-critical); border-radius: 999px; }
.fill[data-band="low"] { background: var(--status-critical); }
.fill[data-band="mid"] { background: var(--status-severe); }
.fill[data-band="high"] { background: var(--status-warning); }
.fill[data-band="full"] { background: var(--status-good); }
.empty { margin-top: 18px; padding: 22px; text-align: center; color: var(--text-secondary); background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius-card, 12px); font-size: 13.5px; }
.foot { margin-top: 18px; padding-top: 14px; border-top: 0.5px solid var(--border); color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body data-fit-content>
<div class="wrap ui-card">
  <div class="label">Etude coverage</div>
  <h1 id="title">Mastery by tag</h1>
  <ul class="rows" id="rows"></ul>
  <div class="foot" id="foot"></div>
</div>
<script>
const ETUDE = /*__DATA__*/null;
(() => {
  'use strict';
  const data = ETUDE && typeof ETUDE === 'object' ? ETUDE : {};
  const $ = id => document.getElementById(id);
  const text = value => (typeof value === 'string' ? value : '');
  const whole = value => Number.isFinite(Number(value)) ? Math.max(0, Math.floor(Number(value))) : 0;
  const band = percent => percent >= 75 ? 'full' : percent >= 50 ? 'high' : percent >= 25 ? 'mid' : 'low';
  const tags = Array.isArray(data.tags) ? data.tags.filter(t => t && typeof t === 'object') : [];

  const rows = $('rows');
  if (!tags.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No tagged items yet.';
    rows.replaceWith(empty);
    $('foot').remove();
    return;
  }

  tags.forEach(tag => {
    const total = whole(tag.total);
    const mastery = Number(tag.mastery);
    const percent = Number.isFinite(mastery) ? Math.round(Math.min(1, Math.max(0, mastery)) * 100) : 0;

    const row = document.createElement('li');

    const head = document.createElement('div');
    head.className = 'row-head';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = text(tag.tag);
    const figs = document.createElement('span');
    figs.className = 'figs';
    figs.textContent = `${percent}% · ${whole(tag.seen)}/${total}`;
    head.append(name, figs);
    row.append(head);

    const meter = document.createElement('div');
    meter.className = 'meter';
    meter.setAttribute('role', 'progressbar');
    meter.setAttribute('aria-valuemin', '0');
    meter.setAttribute('aria-valuemax', '100');
    meter.setAttribute('aria-valuenow', String(percent));
    meter.setAttribute('aria-valuetext', `${text(tag.tag)}: ${percent}% mastery, ${whole(tag.seen)} of ${total} practiced`);
    const fill = document.createElement('div');
    fill.className = 'fill';
    fill.dataset.band = band(percent);
    fill.style.width = `${percent}%`;
    meter.append(fill);
    row.append(meter);
    rows.append(row);
  });

  $('foot').textContent = 'Mastery is coverage-weighted: mean of min(streak, 3) / 3, with unseen items counting as zero.';
})();
</script>
</body>
</html>
